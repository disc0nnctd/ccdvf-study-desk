 is per-request duration; throughput is aggregate rate. They are optimized differently and frequently trade against each other.","sources":["https://platform.claude.com/docs/en/about-claude/glossary"],"origin":"Community","sourceId":"138"},{"id":"C139","domain":"Model Selection and Optimization","question":"An offline enrichment job must finish a large queue as fast as possible overall. Which optimization matters most?","options":["Minimizing the latency of each individual call","Enabling streaming so results appear sooner","Maximizing throughput via concurrency and batching within rate limits","Raising the token ceiling on every request"],"answers":[2],"explanation":"When nothing waits on any single response, aggregate completion rate is the objective, and concurrency plus batching within the rate limit is how it is raised.","sources":[],"origin":"Community","sourceId":"139"},{"id":"C140","domain":"Model Selection and Optimization","question":"Raising concurrency improved throughput up to a point, after which per-request latency climbed sharply and errors appeared. What is the most likely explanation?","options":["Streaming was implicitly disabled at high concurrency","Higher concurrency forces a lower model tier","The context window shrinks as concurrency rises","Concurrency has exceeded the account's rate limits, producing throttling and queueing"],"answers":[3],"explanation":"Throughput scales with concurrency only until the rate limit binds; beyond it requests are throttled and queue, which lengthens latency and surfaces rate-limit errors.","sources":[],"origin":"Community","sourceId":"140"},{"id":"C141","domain":"Model Selection and Optimization","question":"Which change reduces perceived latency for a user without reducing the total tokens generated?","options":["Streaming the response so output renders as it is produced","Raising the token ceiling","Adding more concurrent workers to the request pool","Submitting the request through batch processing"],"answers":[0],"explanation":"Streaming does not shorten generation but lets the user begin reading immediately, which is what perceived latency measures. Batching and worker counts do not help a single waiting user.","sources":["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency"],"origin":"Community","sourceId":"141"},{"id":"C142","domain":"Model Selection and Optimization","question":"Which factor most directly influences time-to-first-token as opposed to total response time?","options":["The requested maximum output length","The number of distinct tools defined on the request","Whether results are written to a database afterward","The size of the input that must be processed before generation begins"],"answers":[3],"explanation":"Time-to-first-token is dominated by processing the input prefix, which is why caching a large prefix improves it. Output length governs total duration, not the initial delay.","sources":["https://platform.claude.com/docs/en/about-claude/glossary","https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency"],"origin":"Community","sourceId":"142"},{"id":"C143","domain":"Model Selection and Optimization","question":"Select the TWO statements that correctly describe latency and throughput optimization.","options":["Increasing concurrency reliably reduces the latency of each individual request","Throughput is unaffected by account rate limits","A lighter model tier generally reduces per-request latency","Caching a large static prefix can improve time-to-first-token on repeat requests"],"answers":[2,3],"explanation":"Lighter tiers respond faster and cached prefixes shorten the pre-generation phase. Concurrency raises aggregate throughput without shortening any single request, and rate limits cap throughput directly.","sources":["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency"],"origin":"Community","sourceId":"143"},{"id":"C144","domain":"Model Selection and Optimization","question":"A real-time moderation check must return a verdict before a message is posted. Which priority should govern the configuration?","options":["Throughput, since moderation runs on every message","Latency, since the user's action is blocked until the verdict returns","Cost, since moderation is high volume","Reasoning depth, since moderation is nuanced"],"answers":[1],"explanation":"A synchronous gate in the user's path is latency-bound: the check must return fast enough not to stall the interaction, which typically points to a lighter tier and a tight output budget.","sources":[],"origin":"Community","sourceId":"144"},{"id":"C351","domain":"Model Selection and Optimization","question":"Latency is the stated problem and output quality is fine. Which lever avoids changing what the model produces?","options":["Rewriting the prompt to ask for different, shorter content that takes less time to generate","Switching to a smaller tier, which keeps the same output at lower latency","Streaming, prefix caching, or fast mode where available","Raising max_tokens"],"answers":[2],"explanation":"A smaller tier changes the output. Streaming improves perceived latency, caching shortens time to first token, and fast mode makes the same model generate faster. Lowering effort also cuts latency but trades some thoroughness, so measure it.","sources":["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency","https://platform.claude.com/docs/en/models/opus-5-5/migration-guide"],"origin":"Community","sourceId":"351"},{"id":"C145","domain":"Model Selection and Optimization","question":"For the task 'simple intent classification', which model-selection approach best balances cost, latency, and quality?","options":["Match the model to task complexity: smaller, faster models for simple, high-volume work","Model choice has no measurable effect on cost or latency","Always default to the most capable (and most expensive) model regardless of task complexity","Always use the cheapest model regardless of accuracy requirements"],"answers":[0],"explanation":"Cost-effective architecture matches model capability to task difficulty and latency needs, using smaller, faster models for simple, high-volume work and reserving the most capable model for genuinely complex reasoning, rather than defaulting to one tier for everything.","sources":["https://platform.claude.com/docs/en/about-claude/pricing"],"origin":"Community","sourceId":"145"},{"id":"C146","domain":"Model Selection and Optimization","question":"For 'a voice-of-customer sentiment tagger', which is the strongest signal that a smaller/cheaper model tier would be sufficient rather than the largest available model?","options":["The task is high-volume and pattern-based, with well-defined outputs","The task involves any use of the word 'analysis' anywhere in its description","The application is used by external customers rather than internal staff","The team prefers using fewer distinct API calls"],"answers":[0],"explanation":"Task complexity and reasoning depth — not audience or terminology — is the key signal for whether a smaller, cheaper model tier is sufficient.","sources":[],"origin":"Community","sourceId":"146"},{"id":"C147","domain":"Model Selection and Optimization","question":"A high-volume routing classifier assigns tickets to one of eight queues, and accuracy is already acceptable on a light tier. What follows?","options":["Alternate tiers request by request to balance cost and quality across the queue","Enable extended thinking on the light tier to improve label consistency","Move to the most capable tier to protect against edge cases","Keep the light tier, since it already meets the quality bar"],"answers":[3],"explanation":"When a light tier already meets the quality bar, additional capability adds cost and latency without benefit. Tier selection is validated empirically, not by defaulting upward.","sources":[],"origin":"Community","sourceId":"147"},{"id":"C148","domain":"Model Selection and Optimization","question":"What is the most defensible way to choose a tier for a new recurring workload?","options":["Choose the cheapest tier and accept the resulting quality","Evaluate candidate tiers against a representative labelled sample and pick the cheapest that clears the quality bar","Choose the most capable tier and downgrade only if costs become a problem","Choose based on the tier used by a previous unrelated project"],"answers":[1],"explanation":"Measuring candidates against representative data identifies the cheapest tier that meets requirements. The alternatives substitute habit or assumption for evidence.","sources":[],"origin":"Community","sourceId":"148"},{"id":"C149","domain":"Model Selection and Optimization","question":"Which workload most justifies the most capable available tier?","options":["Normalizing postal addresses into a fixed format","Detecting whether a message contains a phone number","Analysing an ambiguous contract clause where a wrong reading carries legal consequence","Converting a date string between two formats"],"answers":[2],"explanation":"Capability earns its cost where judgment is genuinely difficult and errors are expensive. Deterministic formatting and simple detection do not benefit.","sources":[],"origin":"Community","sourceId":"149"},{"id":"C150","domain":"Model Selection and Optimization","question":"A team wants a light tier for cost but needs stronger performance on one narrow subtask. Which design addresses this best?","options":["Send every request to both tiers and compare outputs","Keep the light tier everywhere and accept the weaker results on that subtask","Escalate only that subtask to a more capable tier","Move the whole workload to the capable tier"],"answers":[2],"explanation":"Tier choice can be made per step rather than per application, so escalating only the demanding subtask captures most of the saving while meeting the quality requirement.","sources":[],"origin":"Community","sourceId":"150"},{"id":"C151","domain":"Model Selection and Optimization","question":"What does moving to a more capable tier generally cost?","options":["Nothing; capability improves at constant price and speed","Only context window size","Higher per-token price and typically slower responses","Only the ability to use tools"],"answers":[2],"explanation":"Capability trades against price and speed, which is why tier selection is a per-workload decision rather than a single global default.","sources":["https://platform.claude.com/docs/en/about-claude/models/overview"],"origin":"Community","sourceId":"151"},{"id":"C152","domain":"Model Selection and Optimization","question":"After a tier change, a team wants confidence that quality has not regressed. What is the right instrument?","options":["Spot-checking a handful of outputs by eye","Monitoring the error rate of HTTP responses","Comparing average response length before and after","Running a fixed evaluation set through both tiers and comparing scored results"],"answers":[3],"explanation":"A held-out evaluation set scored consistently is what makes a tier comparison meaningful. Length and HTTP errors say nothing about answer quality.","sources":[],"origin":"Community","sourceId":"152"},{"id":"C153","domain":"Model Selection and Optimization","question":"Select the TWO signals that a cheaper tier is likely sufficient for a task.","options":["The task is narrow and pattern-based with well-defined expected outputs","The task requires weighing several ambiguous, interacting considerations","A representative sample shows the light tier matching the capable tier's accuracy","Errors on the task are costly and difficult to detect downstream"],"answers":[0,2],"explanation":"Narrow, well-specified work and measured parity both support the cheaper tier. Genuine ambiguity and high error cost argue for more capability.","sources":[],"origin":"Community","sourceId":"153"},{"id":"C349","domain":"Model Selection and Optimization","question":"Two models are being compared for an agentic task. The cheaper one has half the per-token price but often needs extra turns and retries. What metric should decide?","options":["Cost per completed task, including retries and failures","Public benchmark rank on agentic coding leaderboards","Price per token only, since that is what the invoice shows","Average response length"],"answers":[0],"explanation":"A stronger model can use fewer turns. Compare on cost per completed task, and price the hardest tenth: a failed task bills its tokens, the retry and the downstream damage.","sources":[],"origin":"Community","sourceId":"349"},{"id":"C350","domain":"Model Selection and Optimization","question":"A product spec lists features but gives no figures for acceptable latency, cost or quality. What should happen before choosing a model?","options":["Pick the model at the top of a public leaderboard for the closest matching task","Obtain the quality, latency and cost targets, then choose against them","Pick a mid-range model as a compromise, then adjust later if anyone complains about the results","Pick the newest model by default"],"answers":[1],"explanation":"No model choice is defensible until the quality bar, the wait and the spend are known. A public benchmark measures work that is not yours and sets no threshold.","sources":[],"origin":"Community","sourceId":"350"},{"id":"C330","domain":"Model Selection and Optimization","question":"A working integration moves to a newer model. The request shape still validates. What should the team do before switching production traffic?","options":["Only update the model ID string","Re-baseline: rerun the evals and re-check settings, token counts and cost","Rewrite all prompts from scratch","Nothing; a request shape that still validates means the new model is a drop-in replacement"],"answers":[1],"explanation":"A release changes behaviour, not just an identifier. Run the evaluation set, re-check settings that may now be rejected (sampling, thinking budgets, prefill), and re-measure token counts and cost. Some breaks are loud 400s; others are quiet cost or behaviour shifts, such as instructions written for an older model being followed too literally or a new tokenizer changing counts.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide","https://platform.claude.com/docs/en/about-claude/model-deprecations"],"origin":"Community","sourceId":"330"},{"id":"C331","domain":"Model Selection and Optimization","question":"What is the difference between a deprecated model and a retired model?","options":["They mean the same thing","A deprecated model fails immediately, while a retired model keeps working for existing customers","Deprecated still works but has a retirement date; retired requests fail","A retired model still works at a discount for existing customers until its successor ships"],"answers":[2],"explanation":"A deprecated model still works but has an announced retirement date and a recommended replacement; a retired model is unavailable and requests to it fail. Deprecated means plan your migration; retired means it is already too late. Anthropic notifies customers with at least 60 days' notice for publicly released models.","sources":["https://platform.claude.com/docs/en/about-claude/model-deprecations"],"origin":"Community","sourceId":"331"},{"id":"C332","domain":"Model Selection and Optimization","question":"How can a team find every remaining place its applications call a model scheduled for retirement?","options":["Check the SDK version number","Ask the model which version it is","Wait for requests to start failing after the retirement date, then fix each one","Audit API usage by key and model, and search config for the model ID"],"answers":[3],"explanation":"A usage audit (for example, the Console usage export broken down by API key and model) locates call sites by key and model, which is faster and more reliable than waiting for failures after the retirement date.","sources":["https://platform.claude.com/docs/en/about-claude/model-deprecations"],"origin":"Community","sourceId":"332"},{"id":"C333","domain":"Model Selection and Optimization","question":"A team's per-token price is unchanged after a model upgrade, but monthly spend rose about 20%. What is a likely explanation?","options":["A different tokenizer produces more tokens for the same text","Caching stops working after upgrades","Output tokens became free and input tokens doubled in price on the new model","Prices are secretly higher than published, and invoices round up to the next tier"],"answers":[0],"explanation":"Tokenizers can change between generations, so the same text can cost more tokens. Re-baseline by counting tokens on representative inputs (with the token counting endpoint) before and after a migration.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide"],"origin":"Community","sourceId":"333"},{"id":"C466","domain":"Model Selection and Optimization","question":"Why can instructions written for an older model cost more on a newer one even when outputs still pass?","options":["Newer models follow stale verbose instructions more literally","Instructions are billed as output tokens","Newer models charge for reading the system prompt instructions twice per request","Older instructions are rejected with a 400"],"answers":[0],"explanation":"Newer models follow instructions more literally, so stale verbose or 'be thorough' instructions can be obeyed fully, increasing output and spend. Migration includes auditing prompts written for the previous model; remove cruft that no longer serves a purpose and re-measure.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"],"origin":"Community","sourceId":"466"},{"id":"C154","domain":"Model Selection and Optimization","question":"Which TWO factors most directly affect the per-request cost of a Claude API call?","options":["The number of input and output tokens processed","Which model is used (different models have different per-token pricing)","The number of employees at the company making the call","The programming language of the client application"],"answers":[0,1],"explanation":"Cost scales with token volume (input + output) and the chosen model's pricing tier; the client language and company size are irrelevant to API cost.","sources":["https://platform.claude.com/docs/en/about-claude/pricing.md"],"origin":"Community","sourceId":"154"},{"id":"C155","domain":"Model Selection and Optimization","question":"Output tokens are generally priced differently from input tokens for Claude models. What is the practical implication for cost optimization?","options":["Output length has no bearing on cost, only input length matters","Keeping outputs concise, since output tokens usually cost more than input tokens","Input and output tokens always cost exactly the same","Only the Batches API has token-based pricing; synchronous calls are billed at a flat per-request rate"],"answers":[1],"explanation":"Output tokens are typically more expensive per token than input tokens, so constraining unnecessarily long or verbose output (for example with explicit formatting instructions) is a meaningful cost lever.","sources":["https://platform.claude.com/docs/en/about-claude/pricing"],"origin":"Community","sourceId":"155"},{"id":"C156","domain":"Model Selection and Optimization","question":"A classification endpoint should return one of five labels but often returns a paragraph of justification. What is the most efficient correction?","options":["Raise the output ceiling so the justification is never truncated mid-sentence","Post-process the paragraph with a parser that extracts the label from the text","Move to a more capable tier","Instruct it to return only the label, with a low output ceiling as a guard"],"answers":[3],"explanation":"Preventing unnecessary generation is cheaper than paying for it and discarding it. A low ceiling backs up the instruction against occasional verbosity.","sources":[],"origin":"Community","sourceId":"156"},{"id":"C157","domain":"Model Selection and Optimization","question":"What does the maximum-tokens parameter actually control?","options":["A target length the model attempts to match","The total of input plus output tokens for the request","The size of the context window available to the model","An upper bound on generated output, beyond which generation halts"],"answers":[3],"explanation":"It is a hard ceiling on generation, not a target. Set it too low and responses are cut off mid-sentence rather than shortened gracefully.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop.md"],"origin":"Community","sourceId":"157"},{"id":"C158","domain":"Model Selection and Optimization","question":"Why is relying solely on a low output ceiling a poor way to obtain concise answers?","options":["The ceiling is ignored when a system prompt is present","Lower ceilings raise the per-token price","The ceiling applies only to streaming responses","The ceiling truncates mid-generation rather than producing a complete shorter answer"],"answers":[3],"explanation":"A ceiling stops generation abruptly wherever it lands. Conciseness comes from instructing the desired length, with the ceiling serving only as a backstop.","sources":[],"origin":"Community","sourceId":"158"},{"id":"C159","domain":"Model Selection and Optimization","question":"Select the TWO practices that reduce output-token spend without degrading the delivered result.","options":["Setting the token ceiling far below the needed length so responses are always short","Requesting only the fields the caller actually consumes rather than a full narrative","Enabling extended thinking on every request to improve efficiency","Specifying a concrete length appropriate to where the output is displayed"],"answers":[1,3],"explanation":"Asking only for what is consumed, at a length matched to its destination, cuts waste without loss. An under-set ceiling truncates mid-sentence, and always-on reasoning adds billed tokens.","sources":[],"origin":"Community","sourceId":"159"},{"id":"C235","domain":"Agents and Workflows","question":"What is the key difference between the API SDK's Tool Runner and the Claude Agent SDK?","options":["They are two names for the same package","The Tool Runner is hosted by Anthropic as a managed service, while the Agent SDK must be self-hosted","The Agent SDK cannot use custom tools or MCP servers, while the Tool Runner supports both of them","Tool Runner loops your tools on the Messages API; the Agent SDK is the Claude Code harness"],"answers":[3],"explanation":"Both are harness-only (you host them). The Tool Runner automates request, execute, loop for your own tools. The Agent SDK is Claude Code as a library: query(), built-in tools, context management, hooks, subagents, permission modes and sessions.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner","https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"235"},{"id":"C236","domain":"Agents and Workflows","question":"A team wants Anthropic to run the agent loop and host a per-session sandbox where bash and file operations execute, with versioned agent configurations. Which option fits?","options":["Managed Agents","The Tool Runner, which includes a hosted sandbox","The Message Batches API","A manual while-loop over the Messages API"],"answers":[0],"explanation":"Managed Agents is the option that supplies both the harness and the deployment: the agent is a stored, versioned resource and each session gets a hosted container. The manual loop, Tool Runner and Agent SDK all leave hosting to you.","sources":["https://platform.claude.com/docs/en/managed-agents/overview"],"origin":"Community","sourceId":"236"},{"id":"C237","domain":"Agents and Workflows","question":"A regulated team must keep conversation and tool data within systems they control, and a fully hosted agent runtime stores session state server-side. How should this requirement be treated?","options":["As irrelevant, because the model provider is responsible for compliance on its hosted runtime","As a hard constraint that rules out non-compliant options before comparing anything else","As something to resolve after a pilot proves the value","As one factor to balance against delivery speed"],"answers":[1],"explanation":"Residency, retention and regulatory rules define the feasible set; they never compete inside it. A hosted runtime that stores session data is ruled out wherever the rule forbids that, whatever its convenience. Choose the deployment the rule permits, then reduce its operational cost.","sources":["https://platform.claude.com/docs/en/managed-agents/overview"],"origin":"Community","sourceId":"237"},{"id":"C238","domain":"Agents and Workflows","question":"After adopting the Agent SDK, a developer also writes their own loop to manage conversation history 'for safety'. What is the main problem?","options":["Nothing; duplicate history improves reliability by giving a backup","Custom history makes prompt caching free","It creates two sources of truth for the same conversation state","The SDK will refuse to run if a second history exists in the same process"],"answers":[2],"explanation":"Hand-writing part of what the framework owns produces two owners for one piece of state, and they drift. Once a framework owns the loop, dispatch and history, let it. A custom loop is justified by a constraint the library cannot meet, not by caution.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"238"},{"id":"C239","domain":"Agents and Workflows","question":"An Agent SDK run can end in success, by hitting the turn ceiling, by hitting the spend ceiling, or with an error. How should application code decide what happened?","options":["Search the final text for the word 'done'","Count the number of tool calls made","Assume success if no exception was raised","Branch on the result's subtype field"],"answers":[3],"explanation":"Structured result subtypes distinguish success from max-turns, max-budget and execution errors, and cost and usage arrive on all of them. Branch on the subtype, not on the final text, which exists only on success. Parsing prose for completion is fragile.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"239"},{"id":"C240","domain":"Agents and Workflows","question":"Which situation best justifies writing a custom agent loop over the raw Messages API instead of using an SDK harness?","options":["A hard requirement the harness cannot meet, e.g. a bespoke approval protocol","The team has not used the SDK before and would rather write what it understands","The agent uses more than one tool, which SDK harnesses do not handle in parallel","The team wants fewer lines of code"],"answers":[0],"explanation":"A custom loop charges you for context management, parallel tool handling, retries and exit conditions as code you maintain. Adopt it for a constraint the library cannot satisfy, not out of unfamiliarity.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner"],"origin":"Community","sourceId":"240"},{"id":"C1","domain":"Agents and Workflows","question":"What is the relationship between third-party agent frameworks like LangGraph or Strands and Anthropic's own Claude Agent SDK?","options":["They are mutually exclusive; once a project adopts the Claude Agent SDK, Claude can no longer be called from LangGraph or Strands","Alternative or complementary orchestration layers on top of the same Claude models and API","LangGraph and Strands are Anthropic products that replace the Claude Agent SDK for multi-agent work","They are only usable for non-Claude models"],"answers":[1],"explanation":"Third-party frameworks and the native Agent SDK are alternative or complementary orchestration layers, each with its own abstractions for control flow and state, on top of the same underlying Claude API.","sources":[],"origin":"Community","sourceId":"1"},{"id":"C2","domain":"Agents and Workflows","question":"A team chooses to build a multi-agent system using LangGraph instead of the native Claude Agent SDK. What does this decision primarily reflect?","options":["A requirement imposed by Anthropic for all production agents","An inability to use Claude's tool-use feature at all","A fundamentally different set of agent-design principles that don't apply to SDK-based agents","A build-tooling/orchestration choice layered on top of the same core agent-design principles (tool-use loops, subagents, memory) that apply to SDK-based agents"],"answers":[3],"explanation":"The underlying agent-design principles remain the same; framework choice is an orchestration/tooling decision layered on top.","sources":[],"origin":"Community","sourceId":"2"},{"id":"C3","domain":"Agents and Workflows","question":"Which statement about agent design patterns (e.g., manager/subagent decomposition, memory management) across the native Agent SDK vs. third-party frameworks is most accurate?","options":["These patterns are conceptually consistent across implementations, even though specific syntax and abstractions differ between the native SDK and frameworks like LangGraph or Strands","These patterns only apply to the native Claude Agent SDK and have no equivalent in third-party frameworks","Third-party frameworks cannot implement subagent architectures","Memory management is impossible outside the native SDK"],"answers":[0],"explanation":"The core design patterns transfer conceptually across implementations; only the specific syntax/abstractions differ.","sources":[],"origin":"Community","sourceId":"3"},{"id":"C4","domain":"Agents and Workflows","question":"A team is already deeply invested in an existing LangGraph-based orchestration pipeline for multiple LLM providers and wants to add Claude as one of the models. What is a reasonable interpretation of this scenario?","options":["LangGraph can call Claude as one model in its existing graph, with no rewrite onto the Agent SDK","They must abandon LangGraph and rebuild the whole pipeline on the Claude Agent SDK, because Claude cannot sit in a multi-provider graph","Claude can only be used through its own SDK, never through third-party orchestration","This is not possible; LangGraph cannot be used with Claude"],"answers":[0],"explanation":"Third-party frameworks can incorporate Claude as one of their supported models without forcing a rewrite onto Anthropic's native SDK.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"4"},{"id":"C5","domain":"Agents and Workflows","question":"What is a reasonable factor in choosing the native Claude Agent SDK over a third-party framework like Strands for a new, Claude-only agent project?","options":["There is no valid reason to ever choose the native SDK","Direct alignment with Claude features and no extra abstraction layer","Third-party frameworks cannot be used with Claude under any circumstances, so the native SDK is the only possible choice","The native SDK is the only option that supports tool use at all, so a framework-based agent would be limited to plain text"],"answers":[1],"explanation":"For Claude-only projects without a need for multi-provider orchestration, the native SDK avoids an extra abstraction layer.","sources":["https://www.anthropic.com/engineering/building-effective-agents","https://code.claude.com/docs/en/agent-sdk/overview"],"origin":"Community","sourceId":"5"},{"id":"C6","domain":"Agents and Workflows","question":"Is it accurate that using a third-party agent framework means you can no longer apply concepts like stopping conditions, guardrails, or context management to your agent?","options":["False, but only if the framework is LangGraph specifically","False — they are general agent-design concepts that apply whatever orchestration layer runs the loop","True — stopping conditions, guardrails and context management are exclusive to the native Claude Agent SDK and have no framework equivalent","True, but only for stopping conditions specifically"],"answers":[1],"explanation":"Stopping conditions, guardrails, and context management are general agent-design concepts applicable regardless of the orchestration layer used.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"6"},{"id":"C7","domain":"Agents and Workflows","question":"Which requirement most favors a third-party agent framework over the native SDK?","options":["The agent performs a single well-understood step","The project must remain portable across several model providers","The team wants the closest possible access to Claude-specific capabilities","The project targets Claude exclusively and needs minimal abstraction"],"answers":[1],"explanation":"Multi-provider portability is a framework's central value. Claude-only projects wanting direct access to platform features are better served by the native SDK.","sources":[],"origin":"Community","sourceId":"7"},{"id":"C249","domain":"Agents and Workflows","question":"What is the main cost of introducing an agent framework on top of the model API?","options":["They obscure the underlying prompts and responses, making debugging harder","Frameworks cannot call Claude directly, so they need a separate proxy service","Frameworks remove the need for evaluation, because their abstractions are already tested for each model","Frameworks always double token usage"],"answers":[0],"explanation":"Frameworks wrap the same loop but charge in visibility. Starting directly against the API, understanding what the abstraction does, and keeping layers to a minimum in production keeps failures diagnosable.","sources":["https://www.anthropic.com/research/building-effective-agents"],"origin":"Community","sourceId":"249"},{"id":"C241","domain":"Agents and Workflows","question":"A review pipeline's final stage keeps attributing findings to the wrong file, because each worker returns a prose summary that the last stage re-parses. What fixes this?","options":["Ask the final stage to reconstruct locations more carefully","Have each worker emit a structured record (file, symbol, line range, evidence)","Increase the final stage's context window","Concatenate all worker transcripts and pass them to the final stage to re-read in full"],"answers":[1],"explanation":"No later stage can recover a fact nobody recorded. Whichever stage sees a detail must write it down in a defined shape; reconstructing it downstream from prose is guesswork.","sources":[],"origin":"Community","sourceId":"241"},{"id":"C242","domain":"Agents and Workflows","question":"A downstream stage sometimes starts before the stage producing its input has finished. What is the most reliable fix?","options":["Add a fixed delay before the downstream stage runs","Let the downstream stage generate output and prune it afterwards","Gate the downstream stage on an explicit status and manifest that the producing stage sets when it completes","Have the downstream stage look for the word 'complete' in the producer's output"],"answers":[2],"explanation":"Sequencing must rest on a status the producer sets, never on words found in prose or on timing guesses.","sources":[],"origin":"Community","sourceId":"242"},{"id":"C243","domain":"Agents and Workflows","question":"A coordinator delegates a subtask to a subagent but the subagent repeats work another subagent already did and misses a key source. What was most likely missing?","options":["Access to the coordinator's full conversation history, which subagents need before they can call any tool","A higher maximum turn count, so the subagent had time to discover the other subagent's work","A larger model for the subagent","A complete launching prompt: objective, output format, tools, sources and task boundary"],"answers":[3],"explanation":"A subagent starts with no parent conversation. Whatever its launching prompt omits is simply absent, so short delegation instructions produce workers that misread the assignment or duplicate each other.","sources":["https://www.anthropic.com/engineering/multi-agent-research-system"],"origin":"Community","sourceId":"243"},{"id":"C244","domain":"Agents and Workflows","question":"A 40-minute agent task with several named milestones is sometimes interrupted and must restart from scratch. What design change addresses this?","options":["Persist state at each milestone to external storage and reload it when the run resumes","Raise the process timeout so interruptions happen less often","Run a duplicate copy in parallel as a backup","Keep all progress in the conversation context only"],"answers":[0],"explanation":"Resumability needs state that outlives the process. A longer timeout only makes interruption rarer; in-context state dies with the session.","sources":[],"origin":"Community","sourceId":"244"},{"id":"C245","domain":"Agents and Workflows","question":"Select the TWO accurate statements about context in a coordinator/subagent design where each subagent starts with a fresh context (it is not a fork of the coordinator's conversation).","options":["A subagent's own tool calls and results stay in its context; only its final message returns to the coordinator","Separate agents share one context window, so isolation saves no tokens","Anything the subagent needs from earlier work must be passed explicitly in its launching prompt","Subagents automatically see the coordinator's full conversation"],"answers":[0,2],"explanation":"Isolation keeps material out of the coordinator's window, which is the point of delegation, and the price is visibility: a fresh subagent loads its own system prompt and project context but none of the coordinator's turns, so the launching prompt is the only channel in and the final message the only channel out. (A fork is the exception: it inherits the conversation, but its tool calls still stay out of the coordinator's window.)","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop.md","https://code.claude.com/docs/en/agent-sdk/subagents.md","https://code.claude.com/docs/en/sub-agents.md"],"origin":"Community","sourceId":"245"},{"id":"C8","domain":"Agents and Workflows","question":"For an autonomous coding agent editing files, which design choice best balances autonomy with safety?","options":["Give the agent unrestricted permissions so it never has to pause for approval","Define clear stopping conditions and human-approval checkpoints for high-impact actions, while allowing autonomy for low-risk steps","Disable all logging to improve performance","Never allow the agent to use any tools"],"answers":[1],"explanation":"Well-designed agents combine autonomy for low-risk steps with explicit guardrails (approval checkpoints, stopping conditions) for higher-impact or irreversible actions.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"8"},{"id":"C9","domain":"Agents and Workflows","question":"An agent can issue refunds. Which guardrail design is soundest?","options":["Instruct the agent in its system prompt never to exceed the refund limit","Use a more capable model tier so the limit is respected reliably","Enforce the limit in the refund service itself and require human approval above a threshold","Review a log of refunds weekly and reverse any that were incorrect"],"answers":[2],"explanation":"Limits must be enforced where the action executes, since prompt instructions are not a security boundary. Human approval above a threshold bounds the damage of any single decision.","sources":[],"origin":"Community","sourceId":"9"},{"id":"C10","domain":"Agents and Workflows","question":"Why is a prompt instruction an inadequate guardrail for a high-impact action?","options":["Instructions influence behavior but cannot guarantee it, so they do not constitute enforcement","Instructions are stripped from requests that define tools","Instructions only apply to the first turn of a conversation","Prompt instructions cannot describe constraints precisely enough"],"answers":[0],"explanation":"Prompting shapes likely behavior; it does not make an action impossible. Anything that must not happen requires a technical control outside the model.","sources":[],"origin":"Community","sourceId":"10"},{"id":"C11","domain":"Agents and Workflows","question":"Select the TWO controls that meaningfully bound the risk of an autonomous agent with write access.","options":["Increasing the iteration limit so the agent can self-correct","Scoping credentials so the agent can only reach the specific resources it needs","Adding a strongly worded warning to the system prompt","Requiring explicit human approval before irreversible operations"],"answers":[1,3],"explanation":"Narrow credentials and approval gates on irreversible actions are enforceable controls. Prompt warnings are advisory, and more iterations expand rather than bound the blast radius.","sources":["https://www.anthropic.com/engineering/building-effective-agents","https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"11"},{"id":"C248","domain":"Agents and Workflows","question":"A requirement states an agent must never run a destructive database command. Which control satisfies it?","options":["A firmly worded instruction in the system prompt, repeated at the end of every user turn","Logging every command and reviewing the log daily","Asking the agent to double-check its own commands before running them","A pre-execution check that can refuse the call, such as a hook or deny rule"],"answers":[3],"explanation":"A refusal has to arrive while the call is still a request. Logs and reviews record an action that already happened, prompts change what is attempted rather than what is allowed, and self-checks add no independence.","sources":["https://code.claude.com/docs/en/hooks","https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"248"},{"id":"C12","domain":"Agents and Workflows","question":"In the Claude Agent SDK, what is the general purpose of the core query()-style interface?","options":["It only formats the model's text output for display in a terminal and plays no part in running the agent","It replaces the need for any tool definitions","It drives the agent loop: sending messages, handling tool calls and managing turns","It is used exclusively for offline evaluation runs against recorded transcripts, not for running agents"],"answers":[2],"explanation":"The Agent SDK's core interface manages the agent loop (message exchange, tool call handling, turn management) so developers can build agents without reimplementing this control flow from scratch.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"12"},{"id":"C13","domain":"Agents and Workflows","question":"What does the Claude Agent SDK primarily provide over hand-rolling an agent against the raw API?","options":["Ready-made handling of the agent loop, tool wiring, and session mechanics","Automatic elimination of token costs for tool calls","Exclusive access to models unavailable through the API","A guarantee that the agent cannot take unsafe actions"],"answers":[0],"explanation":"The SDK packages the recurring scaffolding — loop control, tool integration, session handling — so teams are not rebuilding it. It confers no special model access or safety guarantee.","sources":["https://code.claude.com/docs/en/agent-sdk/overview","https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"13"},{"id":"C14","domain":"Agents and Workflows","question":"A team is writing its third bespoke agent loop and finding the retry, tool-dispatch, and history-management code repetitive. What does this suggest?","options":["They should move the loop into the system prompt","They should switch to batch processing","Agents are the wrong architecture for the problem","The repeated scaffolding is what the Agent SDK exists to provide"],"answers":[3],"explanation":"Repeatedly rebuilding loop plumbing is the signal to adopt the SDK, which supplies that layer and leaves the team to write only domain-specific tools and policy.","sources":["https://code.claude.com/docs/en/agent-sdk/overview"],"origin":"Community","sourceId":"14"},{"id":"C15","domain":"Agents and Workflows","question":"What role does context/memory management play in longer-running agent workflows?","options":["Memory management only matters for single-turn, non-agentic requests where the prompt is very long","Agents automatically discard all prior context after each tool call, so there is nothing for developers to manage","Summarizing or pruning earlier steps keeps the agent's context within limits and focused","It is irrelevant since agents have unlimited context by default"],"answers":[2],"explanation":"Long-running agents accumulate context over many steps; without active management (summarization, pruning) this can exceed context limits or dilute the model's focus with irrelevant history.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"15"},{"id":"C16","domain":"Agents and Workflows","question":"A long-running agent's context fills with verbose tool outputs, crowding out its objective. What is the most effective remedy?","options":["Summarize or truncate tool results before appending them, retaining only decision-relevant fields","Remove the objective from context to make room for tool output","Disable tools once the context reaches a threshold","Restart the agent from scratch whenever context grows large"],"answers":[0],"explanation":"Compacting tool output at the point of ingestion keeps the goal and salient state resident. Dropping the objective or restarting discards exactly what must persist.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"16"},{"id":"C17","domain":"Agents and Workflows","question":"Which state should an agent persist outside the conversation context?","options":["Only the system prompt","Durable facts and progress that must survive compaction or a restart","Only the most recent tool result","Nothing; the context window is the correct place for all state"],"answers":[1],"explanation":"Context is a working buffer that gets compacted and eventually lost. Anything that must survive belongs in external storage the agent can read back.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"17"},{"id":"C18","domain":"Agents and Workflows","question":"Which TWO of the following are legitimate reasons to build a custom agent loop instead of relying entirely on default SDK behavior?","options":["You need fine-grained control over intermediate steps, such as custom logging, guardrails, or human-approval checkpoints between tool calls","You want to prevent the agent from ever using more than one tool call in total","Your application has domain-specific stopping conditions or retry logic not covered by default behavior","Custom agent loops are required before any tool can be defined"],"answers":[0,2],"explanation":"Custom loops are useful when you need extra control (logging, guardrails, human-in-the-loop) or nonstandard stopping/retry logic — not for arbitrarily restricting tool-call counts or as a prerequisite for tool definitions.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop","https://platform.claude.com/docs/en/managed-agents/overview.md","https://code.claude.com/docs/en/agent-sdk/agent-loop.md"],"origin":"Community","sourceId":"18"},{"id":"C19","domain":"Agents and Workflows","question":"What is the minimal cycle of a custom agent loop?","options":["Call the model, run any requested tools, append the results, repeat until a stop condition holds","Send the request once and parse whatever comes back","Pre-plan every tool call up front, then execute them in a fixed order without consulting the model again","Stream the response and terminate at the first content block"],"answers":[0],"explanation":"The loop alternates model turns with tool execution, feeding results back until a stopping condition is met. Fixed pre-planned sequences are workflows, not agent loops.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop","https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"19"},{"id":"C20","domain":"Agents and Workflows","question":"An agent loop occasionally runs indefinitely, repeating the same tool call. Which safeguard addresses this most directly?","options":["A maximum-iteration cap plus detection of repeated no-progress states","A more capable model tier","Removing the tool from the agent's toolset","Increasing the output token ceiling so the agent has room to finish its reasoning in one turn"],"answers":[0],"explanation":"Non-terminating loops need an explicit bound plus progress detection so repeated identical states break out. Model capability does not guarantee termination.","sources":["https://www.anthropic.com/engineering/building-effective-agents","https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"20"},{"id":"C21","domain":"Agents and Workflows","question":"You're designing a multi-step travel-booking agent. How should tool access be scoped for this agent?","options":["Tools should be assigned randomly to test robustness","Only the tools its task actually needs (least privilege)","Scoping doesn't matter, since agents never misuse tools they are given","Access to every tool in the organization by default, so the agent never stalls waiting for a missing permission"],"answers":[1],"explanation":"Least privilege: give the agent only the tools its task needs. A booking agent that can reach every tool in the organization turns one bad decision or one injected instruction into an incident with a much larger blast radius.","sources":["https://code.claude.com/docs/en/agent-sdk/subagents"],"origin":"Community","sourceId":"21"},{"id":"C22","domain":"Agents and Workflows","question":"Which characteristic of a task most strongly indicates an agentic design rather than a fixed pipeline?","options":["The task has high request volume","The task requires structured JSON output","The task must complete within a strict latency budget","The steps needed cannot be enumerated in advance and depend on what is discovered"],"answers":[3],"explanation":"Agency is warranted when the path is data-dependent and cannot be scripted ahead of time. Volume, output shape, and latency constraints do not by themselves imply an agent.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"22"},{"id":"C23","domain":"Agents and Workflows","question":"You are designing a system with 2 specialized subagents coordinated by a manager/supervisor process. What is the primary benefit of this manager-subagent architecture?","options":["It guarantees zero errors across the system, because the manager re-checks every subagent output","Decomposing a complex task into narrower subtasks, each with tighter context and scope","It eliminates the need for any tool use","It removes the need for evaluation or testing, since each subagent checks the work of the others"],"answers":[1],"explanation":"Manager/subagent patterns decompose complex tasks so each subagent operates with a narrower, more focused context, generally improving reliability and manageability over one large monolithic agent. Nothing guarantees zero errors, and evaluation and tool use are still needed.","sources":["https://code.claude.com/docs/en/agent-sdk/subagents"],"origin":"Community","sourceId":"23"},{"id":"C24","domain":"Agents and Workflows","question":"You're designing a multi-step travel-booking agent. How should this agent's overall goal best be broken down for reliability?","options":["Into smaller, well-scoped subtasks (possibly subagents), each with a narrower context","It should never be decomposed; one giant prompt is always more reliable because no context is lost between steps","By decomposing it into subtasks written in a different programming language","Decomposition is irrelevant to agent reliability"],"answers":[0],"explanation":"Decomposing a long multi-step goal into well-scoped subtasks, each with a narrower context, is more reliable than one monolithic prompt. Each piece can be tested and its output validated before the next step consumes it.","sources":["https://code.claude.com/docs/en/agent-sdk/subagents"],"origin":"Community","sourceId":"24"},{"id":"C25","domain":"Agents and Workflows","question":"What is the primary benefit of delegating subtasks to subagents rather than handling everything in one context?","options":["Subagents remove the need for tool definitions, because the manager calls every tool on their behalf","Each subagent works in its own narrow context, keeping the manager's context focused","Subagents eliminate token costs for delegated work, since their usage is not billed to the parent","Subagents guarantee deterministic results"],"answers":[1],"explanation":"Delegation partitions context and responsibility, so detail stays with the specialist and the manager retains an uncluttered view of overall progress.","sources":["https://code.claude.com/docs/en/agent-sdk/subagents"],"origin":"Community","sourceId":"25"},{"id":"C26","domain":"Agents and Workflows","question":"A manager agent coordinates six subagents and results are becoming inconsistent and hard to trace. Which corrective step is most useful?","options":["Sharpen each subagent's remit and define the contract for what it returns to the manager","Merge all subagents back into a single agent","Give every subagent access to the full toolset for flexibility","Increase the manager's iteration limit"],"answers":[0],"explanation":"Inconsistency across delegates usually traces to fuzzy responsibilities and undefined return contracts. Tightening both restores traceability without abandoning decomposition.","sources":["https://www.anthropic.com/engineering/multi-agent-research-system"],"origin":"Community","sourceId":"26"},{"id":"C246","domain":"Agents and Workflows","question":"Workers in a multi-agent system sometimes return malformed or contradictory output that flows downstream anyway. Which coordinator responsibility is missing?","options":["Letting workers negotiate contradictions among themselves before anything moves downstream","Validating each worker's result against a defined contract before passing it on","Collapsing the system back into a single call","More detailed tracing of every worker"],"answers":[1],"explanation":"The coordinator owns budget, validation and the handoff contract. Tracing and retries observe failures but intercept nothing on the way downstream; peer negotiation removes the component whose job it was.","sources":[],"origin":"Community","sourceId":"246"},{"id":"C27","domain":"Agents and Workflows","question":"You're designing a multi-step travel-booking agent. What should determine when this agent decides it has completed its task and should stop?","options":["Running forever until manually killed","An arbitrary fixed number of turns with no relation to task completion","Explicit completion criteria tied to the task's actual goal","Never stopping, since agents should always keep iterating"],"answers":[2],"explanation":"Stopping should be tied to an explicit definition of done for the task (for example, booking confirmed and itinerary returned), backed by a safety ceiling on turns or spend. A bare step count with no relation to completion stops too early or too late.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"27"},{"id":"C28","domain":"Agents and Workflows","question":"What should determine when an agent stops working on a task?","options":["When the model stops requesting tools, with no additional bound on iterations, tokens or spend needed","A fixed number of iterations chosen for every task alike, regardless of whether the goal has been reached","When the context window is exhausted","An explicit success condition or a safety bound (iteration or budget cap), whichever comes first"],"answers":[3],"explanation":"Sound termination pairs a definition of done with a backstop bound, so the agent halts on success or on exhausting its allowance rather than drifting.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop","https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"28"},{"id":"C29","domain":"Agents and Workflows","question":"Why is 'the model produced no further tool calls' insufficient as the sole stopping condition?","options":["Tool calls are always present in every response","The absence of a tool call cannot be detected programmatically","The model may stop calling tools without having achieved the objective","Stopping requires an explicit stop sequence to be configured"],"answers":[2],"explanation":"Ceasing to call tools indicates the model has nothing further to try, not that the goal was met. Verification against a success condition is what distinguishes completion from giving up.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"29"},{"id":"C247","domain":"Agents and Workflows","question":"Why should an agent's exit conditions be enforced by the runtime rather than left to the model?","options":["The model cannot read its own system prompt","Runtime limits make every task succeed","The model may not stop calling tools promptly; runtime turn and spend ceilings bound the run","Models are prohibited from deciding when a task is finished, so only the runtime can end a loop"],"answers":[2],"explanation":"The model deciding it is finished is the normal exit and a useful signal, but not a guarantee: open-ended tasks can run long. Hard ceilings (maximum turns, maximum spend) bound the run and report which limit was hit, for example as error_max_turns or error_max_budget_usd results in the Agent SDK.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"247"},{"id":"C227","domain":"Agents and Workflows","question":"A support system must send billing questions, technical faults and refund requests to three different prompts, each with its own tools. The categories are known in advance. Which workflow pattern fits?","options":["Routing: classify the input first, then dispatch it to the specialised prompt for that category","An autonomous agent that decides at runtime which steps to take","One large prompt that handles all three categories with every tool attached","Evaluator-optimizer, looping until a grader approves the answer"],"answers":[0],"explanation":"Known categories that each need different handling is the textbook case for routing. Variable input alone is a routing problem, not a reason for autonomy, and one giant prompt with every tool makes selection and evaluation harder.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"227"},{"id":"C228","domain":"Agents and Workflows","question":"A marketing pipeline drafts copy, checks it against brand rules, then translates it. Each step consumes the previous step's output and the order never changes. Which pattern fits?","options":["A fully autonomous agent with a planning step","Prompt chaining: a fixed sequence of calls, with a programmatic check (gate) between steps where useful","Orchestrator-workers, letting a lead model invent subtasks per request","Parallelization, running all three steps at once"],"answers":[1],"explanation":"When the steps can be written down before the input arrives, code holds the plan and each model call does one job. Chaining trades a little latency for accuracy and lets you validate between steps.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"228"},{"id":"C229","domain":"Agents and Workflows","question":"A code-migration tool must change an unpredictable number of files, and which files need changing depends on the repository it is given. Which pattern fits best?","options":["Routing to one of three pre-written migration prompts based on the repository's language","Parallelization over a hard-coded list of file paths taken from a typical repository layout","Orchestrator-workers, where a lead model plans subtasks from the input","Prompt chaining with a fixed list of five steps"],"answers":[2],"explanation":"Orchestrator-workers fits when the subtasks themselves cannot be predicted and depend on the input: a lead model decides the subtasks, delegates them to workers, then synthesises the results. Chaining and fixed parallelization assume the decomposition is known in advance.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"229"},{"id":"C230","domain":"Agents and Workflows","question":"A translation feature has clear, written quality criteria, and experience shows a second pass guided by specific feedback measurably improves the result. Which pattern fits?","options":["Removing the criteria so the model is not constrained by the reviewer's expectations","An autonomous agent with unrestricted tool access so it can look up translations freely","Routing, since translations vary by language","Evaluator-optimizer, looping generate and evaluate a bounded number of times"],"answers":[3],"explanation":"In evaluator-optimizer, one call generates, another evaluates against the criteria and returns feedback, and the loop repeats. It earns its cost only when evaluation criteria are explicit and another round demonstrably helps. Bound the loop so it cannot iterate forever.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"230"},{"id":"C231","domain":"Agents and Workflows","question":"Select the TWO valid uses of the parallelization pattern.","options":["Sectioning: splitting a task into independent parts that run at the same time and are combined afterwards","Voting: running the same task several times to get diverse outputs or a more confident judgement","Running steps in parallel when each step depends on the previous step's output","Running the same prompt twice to make an inherently sequential task finish faster"],"answers":[0,1],"explanation":"Parallelization covers sectioning (independent subtasks) and voting (repeated attempts). It only helps when the pieces are genuinely independent; dependent steps must stay sequential.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"231"},{"id":"C232","domain":"Agents and Workflows","question":"A team fanned a research task out to eight subagents. Token cost rose roughly tenfold, yet answer quality barely moved. What should they check first?","options":["Whether the subtasks were truly independent","Whether adding more subagents would finally show the benefit","Whether the subagents share a conversation history","Whether streaming was enabled on every subagent"],"answers":[0],"explanation":"Multi-agent systems use many times the tokens of a single chat because every worker spends tokens on its own context. That cost is repaid only by genuinely parallel exploration (separate sources, material bigger than one window). Tightly coupled work pays the fan-out cost without any parallel benefit, so a single agent may fit better.","sources":["https://www.anthropic.com/engineering/multi-agent-research-system"],"origin":"Community","sourceId":"232"},{"id":"C233","domain":"Agents and Workflows","question":"Ninety percent of an expense-approval flow follows fixed rules; a small remainder involves unusual cases that need judgement. What is the soundest design?","options":["Make the whole system an autonomous agent so the edge cases are covered","Code the routine path as a fixed workflow and invoke a model-driven step only where the route forks unpredictably","Make the whole system a fixed workflow and reject every unusual case","Use one large prompt for everything to keep the architecture simple"],"answers":[1],"explanation":"The workflow-or-agent decision belongs to each path, not the whole product. A single choice for everything either pays for planning on the settled majority or has no branch for the exceptions.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"233"},{"id":"C234","domain":"Agents and Workflows","question":"Which test best decides whether a task should be built as a workflow or as an agent?","options":["Whether the task can be enumerated as a JSON schema","Whether the number of tool calls is below ten","Whether the steps can be written down before the input arrives","Whether the request volume is high enough to justify the extra cost of an agent"],"answers":[2],"explanation":"Workflows orchestrate the model through predefined code paths, so if the steps can be written down in advance, code holds the plan (a chain, router or other workflow). If the path cannot be hardcoded, an agent lets the model direct its own steps, while code still enforces turn caps, spend caps and validation.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"234"},{"id":"C30","domain":"Agents and Workflows","question":"What is the key distinction between a 'workflow' and an 'agent' in the context of building with Claude?","options":["There is no meaningful distinction; the terms are interchangeable names for any multi-step LLM application","A workflow follows developer-defined steps; an agent decides its own steps and tool calls","Agents never use tools, while workflows always use tools","Workflows can only be built with the Claude Agent SDK, while agents must be built with a third-party framework"],"answers":[1],"explanation":"Workflows are developer-orchestrated fixed sequences; agents use the model to dynamically plan and execute steps, including deciding which tools to call and when to stop.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"30"},{"id":"C31","domain":"Agents and Workflows","question":"You are designing a warehouse-robotics coordination agent and must decide between a fixed, developer-orchestrated workflow versus a fully autonomous agent that plans its own steps. Which factor most strongly favors the fixed-workflow approach?","options":["The task is extremely open-ended with highly variable steps that can't be predicted in advance","There is no meaningful difference; the choice should be arbitrary","The team wants maximum flexibility for handling unexpected edge cases","The steps are well understood, predictable and rarely vary, so auditability matters more"],"answers":[3],"explanation":"Fixed, predictable, well-understood tasks generally favor a developer-orchestrated workflow (more predictable and auditable); highly variable, open-ended tasks favor a dynamically planning agent.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"31"},{"id":"C32","domain":"Agents and Workflows","question":"A document pipeline always performs extract, then validate, then file — never varying. Which design is appropriate?","options":["A manager agent with three subagents","An autonomous agent that decides the order at runtime","A developer-orchestrated workflow with the three steps in fixed sequence","A single request with all three instructions concatenated"],"answers":[2],"explanation":"A known, invariant sequence is best expressed as an explicit workflow: more predictable, cheaper, and easier to debug than granting runtime discretion that is never needed.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"32"},{"id":"C33","domain":"Agents and Workflows","question":"Select the TWO costs of choosing an autonomous agent where a fixed workflow would suffice.","options":["Less predictable execution paths, making behavior harder to test and reason about","Loss of the ability to define custom tools","Inability to return structured output","Additional model calls for planning and reflection that the fixed path would not incur"],"answers":[0,3],"explanation":"Unnecessary agency buys variability and extra deliberation cost. Neither tool definitions nor structured output is affected by the choice.","sources":["https://www.anthropic.com/engineering/building-effective-agents"],"origin":"Community","sourceId":"33"},{"id":"C160","domain":"Prompt and Context Engineering","question":"In a helpdesk bot, you are considering asking the model to reason step by step before giving a final answer. What is the most accurate characterization of this technique's effect?","options":["It should always be avoided because it wastes tokens with no benefit","It has no measurable effect on model behavior in any scenario","It can improve performance on multi-step reasoning tasks, at the cost of additional output tokens","It guarantees perfect output correctness regardless of task difficulty"],"answers":[2],"explanation":"Reasoning through a problem before answering can improve performance on multi-step reasoning tasks, and those reasoning tokens are billed as output. On current models with thinking active, that reasoning happens in thinking blocks controlled by effort. Explicitly prompting for written-out step-by-step reasoning is the fallback when thinking is off, and on some of the newest models a prompt asking the model to write out its reasoning may be declined.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback"],"origin":"Community","sourceId":"160"},{"id":"C161","domain":"Prompt and Context Engineering","question":"A multi-step pricing calculation returns confidently wrong totals. Which prompting change is most likely to help?","options":["Have the model work through the intermediate steps before giving the total","Ask for the total only, to reduce distraction","Raise temperature so the model explores more possible totals before choosing one","Repeat the question twice in the same prompt"],"answers":[0],"explanation":"Working through intermediate steps improves multi-step arithmetic and shows where a wrong total diverged. On models with thinking active, this happens in thinking blocks, steered by effort. Prompting for step-by-step work is the fallback when thinking is off. Asking for only the final figure, raising temperature or repeating the question does nothing to make the calculation more reliable.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"],"origin":"Community","sourceId":"161"},{"id":"C162","domain":"Prompt and Context Engineering","question":"An application needs the benefit of step-by-step reasoning but must return only a clean JSON verdict to its caller. What is the workable approach?","options":["Abandon step-by-step reasoning, since it is incompatible with structured output","Reason in thinking blocks (or a delimited section) and extract only the JSON","Instruct the model to reason silently without producing any tokens, then output only the JSON","Send two unrelated requests and average the results"],"answers":[1],"explanation":"Thinking arrives in separate thinking content blocks ahead of the response, so the text the application returns can be just the JSON verdict. Where thinking is off, asking for reasoning in a delimited section and the answer in a separate tagged section achieves the same separation. On the newest models, prompts asking the model to write out its reasoning in the response may be declined, so rely on thinking there.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","https://platform.claude.com/docs/en/build-with-claude/structured-outputs","https://platform.claude.com/docs/en/build-with-claude/thinking","https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback"],"origin":"Community","sourceId":"162"},{"id":"C163","domain":"Prompt and Context Engineering","question":"What is 'context drift' in the context of long conversations or long-running agents, and why does it matter?","options":["It refers to the model's context window physically shrinking as a conversation gets longer","Behavior gradually diverging from the original goal as irrelevant context accumulates","It only affects image inputs, never text","It is not a real phenomenon and cannot be observed or measured in practice, even in very long conversations"],"answers":[1],"explanation":"Context drift describes behavior degrading or diverging from the original instructions or goal as irrelevant or conflicting information accumulates in context. Mitigations include summarization and periodic re-grounding on the key instructions.","sources":["https://platform.claude.com/docs/en/build-with-claude/context-windows"],"origin":"Community","sourceId":"163"},{"id":"C164","domain":"Prompt and Context Engineering","question":"Late in a long conversation, the model begins ignoring a formatting rule stated in the first message. What is the most reliable fix?","options":["Increase the output token ceiling","Switch to streaming so the rule is applied incrementally","Lower the temperature to zero","Restate the rule in the system prompt or near the current turn so it remains salient"],"answers":[3],"explanation":"Instructions issued far back in a long exchange lose salience. Persisting them in the system prompt or refreshing them near the active turn keeps them in force.","sources":["https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"],"origin":"Community","sourceId":"164"},{"id":"C165","domain":"Prompt and Context Engineering","question":"An assistant thread has accumulated several superseded decisions and the model keeps referring back to abandoned plans. What should the application do?","options":["Raise the model tier so it can resolve the contradictions","Add an instruction to ignore anything contradictory","Append the newest decision more emphatically at the end","Compact the history into a summary that records only the decisions still in force"],"answers":[3],"explanation":"Stale context competes with current intent. Rewriting history into a summary of what still holds removes the contradictory material instead of asking the model to arbitrate it.","sources":["https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"],"origin":"Community","sourceId":"165"},{"id":"C352","domain":"Prompt and Context Engineering","question":"An agent's tool selection gets noticeably worse after about 40 tool calls, even though the window is far from full. What is the most effective remedy?","options":["Merge all tools into one generic tool","Switch to a model with a larger context window so older tool results stay sharp","Rewrite the tool descriptions to be longer","Clear or compact spent tool output, keeping the current task state"],"answers":[3],"explanation":"Degrading tool choice after a fixed number of turns is a window symptom (drift), not a schema symptom. A bigger window preserves every distraction at full detail; clearing or compacting spent material, so stale results stop competing for attention, is what helps.","sources":["https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","https://platform.claude.com/docs/en/build-with-claude/context-editing"],"origin":"Community","sourceId":"352"},{"id":"C353","domain":"Prompt and Context Engineering","question":"What is the difference between context editing (clearing) and compaction?","options":["Clearing drops old tool results for placeholders; compaction summarises history","They are the same feature with two names, both of which delete the oldest messages in the conversation","Both only affect the system prompt","Clearing summarises earlier turns into a note; compaction deletes them without a trace"],"answers":[0],"explanation":"Clearing is tuned by settings like how many recent tool uses to keep and which tools to exclude. Compaction is lossy by design and costs an extra summarisation step; when using it, append the full response content so compaction blocks are preserved.","sources":["https://platform.claude.com/docs/en/build-with-claude/context-editing"],"origin":"Community","sourceId":"353"},{"id":"C354","domain":"Prompt and Context Engineering","question":"A rule ('never quote account numbers in full') is followed early in a long agent run but violated after several compactions. What is the right fix?","options":["Ask the model to remember the rule","Keep the rule where compaction can't rewrite it, like the system prompt","Raise the compaction threshold so it runs less often","Restate the rule in a user message every few turns so it is always recent in the history"],"answers":[1],"explanation":"Compaction may drop anything inside the region it summarises. Changing the threshold alters frequency, not what a summary can discard, and restating the rule in the conversation puts it back inside the region being summarised.","sources":["https://code.claude.com/docs/en/agent-sdk/agent-loop"],"origin":"Community","sourceId":"354"},{"id":"C355","domain":"Prompt and Context Engineering","question":"A knowledge base far larger than any context window is proposed as input to every prompt. What is the right approach?","options":["Use the largest model so everything fits","Split the knowledge base across many parallel requests and merge the answers","Retrieve only the passages relevant to each query and include those","Limit the knowledge base to the first N documents"],"answers":[2],"explanation":"Retrieval keeps the window focused on what the current question needs. Splitting a corpus across requests loses cross-references and multiplies cost.","sources":[],"origin":"Community","sourceId":"355"},{"id":"C356","domain":"Prompt and Context Engineering","question":"A later step in a multi-step workflow needs a decision made in an earlier step, but it behaves as if it never happened. What is the cause?","options":["The model forgot because temperature was too high for it to hold earlier decisions","Later steps always see everything in the same run","The earlier step's output was cached and therefore hidden from every later step in the workflow","Context doesn't travel automatically; it must be passed explicitly"],"answers":[3],"explanation":"Separate calls and separate agents share no context. Nothing carries forward unless something carries it.","sources":[],"origin":"Community","sourceId":"356"},{"id":"C357","domain":"Prompt and Context Engineering","question":"How does prompt engineering differ from context engineering?","options":["Prompting shapes one exchange; context engineering manages the whole window","They are identical","Prompt engineering is about model training data, while context engineering is about inference","Context engineering only concerns images"],"answers":[0],"explanation":"On one call they collapse together. On a long run, the question becomes what should be present at all, which no rewording of an instruction can answer.","sources":["https://www.anthropic.com/engineering/effective-
