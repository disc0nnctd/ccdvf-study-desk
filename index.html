,"options":["Change all 40 call sites on the deadline day","Write a compatibility wrapper that maps the old parameter to the new one","Leave it until the parameter is removed","Pin current behaviour in tests, then migrate in small batches whose effects can each be attributed"],"answers":[3],"explanation":"A replacement that acts on something different is not a rename. A wrapper keeps the call shape and loses the semantics; a deadline-day migration concentrates every semantic change into one push with no slack.","sources":[],"origin":"Community","sourceId":"274"},{"id":"C275","domain":"Applications and Integration","question":"Why should a large refactor and a behaviour change land in separate commits?","options":["So a later symptom can be attributed to one change or the other","Because Git cannot store both a rename and a logic change in one commit","Because refactors must always be reviewed by a different team","Because behaviour changes must not include tests"],"answers":[0],"explanation":"Restructuring changes form and nothing observable; behaviour changes are what break things. Separating them costs one extra commit and keeps the history attributable.","sources":[],"origin":"Community","sourceId":"275"},{"id":"C276","domain":"Applications and Integration","question":"Which asynchronous approach keeps a web server responsive while it waits on several Claude calls for a user who is watching?","options":["Prompt caching, which makes calls concurrent","Non-blocking async calls that overlap the waiting","A sequential loop, which is simpler","The Message Batches API, which returns results faster than individual calls"],"answers":[1],"explanation":"Async concurrency is overlapping waiting, not parallel computation, and responses still arrive at conversational speed. A batch surrenders that speed for a discount, so it does not fit a waiting user.","sources":[],"origin":"Community","sourceId":"276"},{"id":"C85","domain":"Applications and Integration","question":"An API response comes back with stop_reason 'end_turn'. What does this tell the calling application?","options":["The request failed and should be retried","The output was cut off by the max_tokens ceiling","The model finished its turn naturally, so the response can be treated as complete","The model is waiting for a tool result"],"answers":[2],"explanation":"end_turn means natural completion. Other values demand other actions: tool_use (run the tool and return a result), max_tokens or model_context_window_exceeded (output is truncated), pause_turn (send the assistant content back to resume), and refusal (a 200 response the model declined; check stop_details and consider a fallback model).","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"85"},{"id":"C86","domain":"Applications and Integration","question":"A response is unexpectedly cut off mid-sentence with stop_reason 'max_tokens'. What is the most direct fix?","options":["Lower the temperature parameter so the model chooses more concise wording","Increase max_tokens, or continue the generation in a follow-up call","Switch to the Batches API","Add more few-shot examples to the prompt so the model learns to write shorter answers"],"answers":[1],"explanation":"'max_tokens' as a stop reason means the output hit its length ceiling; raising the max_tokens parameter or continuing the generation resolves the truncation.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"86"},{"id":"C87","domain":"Applications and Integration","question":"A response returns with a stop reason indicating the token ceiling was reached. What should the application do?","options":["Recognize the output is incomplete and either raise the ceiling or request a continuation","Treat the partial output as final and display it","Retry the identical request, since the result is nondeterministic","Discard the output and report a server error to the user"],"answers":[0],"explanation":"Hitting the ceiling means the output was cut off mid-generation. The fix is a larger budget or an explicit continuation, not treating truncated text as a finished answer.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"87"},{"id":"C88","domain":"Applications and Integration","question":"A response's stop reason indicates the model wants to use a tool. What does this signal about the conversation?","options":["The tool has already run and its output is in the text block","It has paused awaiting the application to execute the tool and return a result","The request failed validation and must be resubmitted","It has ended and no further turns are possible"],"answers":[1],"explanation":"That stop reason is a handoff: the model has produced a tool request and is waiting for the application to execute it and supply the result so the exchange can continue.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"88"},{"id":"C89","domain":"Applications and Integration","question":"An application configured a stop sequence and now sees responses ending earlier than intended. What is the likely cause?","options":["Stop sequences are advisory and cannot end generation","The model ignores stop sequences when tools are defined","The configured string occurs naturally in the generated content, halting output there","Stop sequences apply only to the system prompt"],"answers":[2],"explanation":"Generation halts at the first occurrence of a configured stop string, so a sequence that appears naturally in normal output will truncate responses unintentionally.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"89"},{"id":"C90","domain":"Applications and Integration","question":"Why is branching on the stop reason preferable to inspecting only the text content of a response?","options":["Different terminations demand different follow-up actions that the text alone does not distinguish","Text content is unavailable unless streaming is enabled","The stop reason is the only field that contains the model's answer","The stop reason guarantees the response is factually correct"],"answers":[0],"explanation":"Natural completion, truncation, a stop-sequence halt, and a tool request all require different handling, and the text alone does not reliably distinguish them.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"90"},{"id":"C310","domain":"Applications and Integration","question":"A response returns HTTP 200 with stop_reason 'refusal'. How should the application treat it?","options":["As a network failure to retry immediately with the same model and the same request body","As a successful answer, since the status is 200, and display the content to the user","As a malformed request needing a code fix","As a declined response: check stop_details and maybe use a fallback model"],"answers":[3],"explanation":"Refusals arrive on a successful 200, so status-code-only error handling misses them. Check stop_reason before reading content, record refusals separately, and use fallbacks where offered.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"310"},{"id":"C311","domain":"Applications and Integration","question":"A request using the server-side web search tool returns stop_reason 'pause_turn'. What should the application do?","options":["Send the assistant content back as-is so the model continues the turn","Treat the response as complete","Return tool_result blocks for the web searches, as with a client tool_use stop","Raise max_tokens and resend the original request"],"answers":[0],"explanation":"pause_turn means the server-side tool loop hit its iteration limit. Unlike tool_use, there are no results to supply: append the assistant response and continue.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"311"},{"id":"C91","domain":"Applications and Integration","question":"When consuming a streamed response, which correctly describes the relationship between the 'message_start' and 'content_block_start' events?","options":["'message_start' always arrives after 'content_block_start' regardless of stream order","Both are part of the ordered sequence of server-sent events that together let the client reconstruct the full message incrementally","Only one of these two events is ever emitted in a given stream","These events are unrelated to streaming and only appear in non-streaming responses"],"answers":[1],"explanation":"Claude's streaming API emits an ordered sequence of SSE events (message_start, content_block_start/delta/stop, message_delta, message_stop) that the client accumulates to reconstruct the full response.","sources":["https://platform.claude.com/docs/en/build-with-claude/streaming"],"origin":"Community","sourceId":"91"},{"id":"C92","domain":"Applications and Integration","question":"A client renders streamed output but the final text is missing fragments. Which implementation error is most likely?","options":["Requesting streaming without also raising the token ceiling","Rendering each delta event in isolation instead of accumulating them in order","Failing to poll the endpoint frequently enough between events","Using a single HTTP connection rather than one per event"],"answers":[1],"explanation":"Streamed responses arrive as ordered incremental deltas that the client accumulates into the full message; treating each event as a standalone value loses content.","sources":["https://platform.claude.com/docs/en/build-with-claude/streaming"],"origin":"Community","sourceId":"92"},{"id":"C93","domain":"Applications and Integration","question":"Which best characterizes how streaming is requested and delivered?","options":["The client polls a job identifier until the response is ready","A separate streaming endpoint returns a WebSocket handle","The response arrives as a single JSON object with an array of deltas","A parameter on the ordinary Messages request switches the response to a sequence of server-sent events"],"answers":[3],"explanation":"Streaming is a flag on the normal Messages request; the response then arrives as a server-sent event stream rather than one blocking payload.","sources":["https://platform.claude.com/docs/en/build-with-claude/streaming"],"origin":"Community","sourceId":"93"},{"id":"C94","domain":"Applications and Integration","question":"During a long stream, a client sees periodic events carrying no content. How should these be handled?","options":["Treated as keep-alive traffic and ignored for rendering purposes","Treated as end-of-message markers","Treated as errors requiring the stream to be restarted","Rendered as blank lines to preserve fidelity"],"answers":[0],"explanation":"Contentless events keep the connection alive during generation gaps; a robust client ignores unrecognized or empty event types rather than failing on them.","sources":["https://platform.claude.com/docs/en/build-with-claude/streaming"],"origin":"Community","sourceId":"94"},{"id":"C95","domain":"Applications and Integration","question":"An error occurs after a stream has already begun emitting text. How does this surface?","options":["As an error event within the stream, after content has already been delivered","As a silent connection close with no indication","As a non-200 HTTP status on the original request","It cannot happen; errors only occur before the first event"],"answers":[0],"explanation":"The HTTP response has already succeeded by then, so mid-stream failures arrive as an error event inside the stream, which clients must handle alongside content events.","sources":["https://platform.claude.com/docs/en/build-with-claude/streaming"],"origin":"Community","sourceId":"95"},{"id":"C96","domain":"Applications and Integration","question":"Which requirement most strongly favors streaming over a single blocking response?","options":["A pipeline that needs the complete response before any downstream step","A request that must be retried automatically on failure","A conversational UI where users should see output begin within a moment","A nightly job writing results to a database with no user waiting"],"answers":[2],"explanation":"Streaming reduces perceived latency where a human is watching output appear. Batch and pipeline work that needs the whole response first gains nothing from it.","sources":[],"origin":"Community","sourceId":"96"},{"id":"C312","domain":"Applications and Integration","question":"While consuming a stream, where does the final stop_reason arrive?","options":["In the first message_start event, before any content blocks are streamed","In the message_delta event near the end of the stream","In an HTTP response header","It is never available when streaming; you must make a second non-streaming call"],"answers":[1],"explanation":"message_start carries the message shell (with stop_reason null), content blocks stream via start/delta/stop events, then message_delta carries stop_reason and final usage, followed by message_stop.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"],"origin":"Community","sourceId":"312"},{"id":"C97","domain":"Applications and Integration","question":"A retail chatbot must return both a natural-language explanation and a machine-readable result that a program consumes, in one turn. What is the most robust approach?","options":["Make two separate, uncoordinated API calls and hope the outputs match","Structured output is impossible with the Claude API","A JSON schema with an explanation field plus result fields, via structured outputs","Ask for prose and extract the values with a regular expression, retrying whenever the pattern fails to match"],"answers":[2],"explanation":"Use a structured response schema with fields for the explanation and program-consumed result, and validate business values after receipt. Schema-constrained generation improves output shape; it does not guarantee factual correctness. Inspect stop_reason before parsing: refusals and max_tokens termination may produce a response that cannot be used as the expected schema. Editorial correction, 3 November 2026.","sources":["https://platform.claude.com/docs/en/build-with-claude/structured-outputs"],"origin":"Community","sourceId":"97"},{"id":"C98","domain":"Applications and Integration","question":"A service needs JSON conforming to a fixed schema and occasionally receives prose wrapped around the object. Which combination is the most robust fix?","options":["Structured outputs (a JSON schema or strict tool), plus validation on receipt","Lower temperature to zero, which guarantees schema conformance on every response","Switch to a larger model and accept the output unvalidated","Raise the token ceiling and retry until prose stops appearing around the object"],"answers":[0],"explanation":"Structured outputs (a JSON schema in output_config.format, or strict: true on a tool) remove the malformed-output failure class by constraining sampling to the schema. Validation on receipt stays, because refusals and max_tokens truncation still return without usable structure, and SDKs strip constraints (such as ranges) the grammar cannot express. Sampling settings never guarantee shape, and non-default temperature is rejected on Claude 4.7 and later.","sources":["https://platform.claude.com/docs/en/build-with-claude/structured-outputs"],"origin":"Community","sourceId":"98"},{"id":"C99","domain":"Applications and Integration","question":"Why is tool use a practical mechanism for obtaining structured data even when no external action is performed?","options":["Tool calls bypass the model's token budget","Tool results are validated server-side before being returned","Tool inputs are schema-defined, so the model's output is shaped by that schema","Tool definitions are cached automatically and cost nothing"],"answers":[2],"explanation":"A tool definition carries an input schema, so a tool call yields schema-shaped arguments, and strict: true on the tool guarantees they validate. For a fixed-shape final response, the dedicated feature is now structured outputs (output_config.format).","sources":["https://platform.claude.com/docs/en/build-with-claude/structured-outputs"],"origin":"Community","sourceId":"99"},{"id":"C100","domain":"Applications and Integration","question":"An extraction service must handle documents where a required field is genuinely absent. What schema design best prevents fabricated values?","options":["Make every field required so the model always returns something","Allow an explicit null or not-found value for the field and instruct the model to use it","Omit the field from the schema entirely","Retry with a higher temperature until a plausible value appears"],"answers":[1],"explanation":"Giving the model a legitimate way to report absence removes the pressure to invent a value. Forcing every field to be populated actively encourages fabrication.","sources":[],"origin":"Community","sourceId":"100"},{"id":"C316","domain":"Applications and Integration","question":"Select the TWO ways a structured-outputs request can still return without usable structured data.","options":["The model refuses (stop_reason 'refusal')","The JSON violates the declared schema's types","The response contains a property not declared in the schema","Generation is cut off at max_tokens"],"answers":[0,3],"explanation":"Structured outputs compile the schema into a grammar, so type violations cannot be produced. The documented escapes are refusals and truncation, which is why you check stop_reason before parsing. Enum casing and unsupported constraints are other reasons to validate on receipt.","sources":["https://platform.claude.com/docs/en/build-with-claude/structured-outputs"],"origin":"Community","sourceId":"316"},{"id":"C259","domain":"Applications and Integration","question":"A Claude-powered system has just gone live. Which description best fits the phase it has entered?","options":["A one-time launch review","An ongoing operate-and-maintain phase with no end date","The end of the model's lifecycle, after which the system needs no further changes","A finished project that can now be handed off and forgotten"],"answers":[1],"explanation":"Development finishes; operation does not. A live system must be watched, answered for and evolved until it is switched off. Activities like launch reviews and retrospectives are finite events inside this open-ended phase.","sources":[],"origin":"Community","sourceId":"259"},{"id":"C260","domain":"Applications and Integration","question":"A team tracks failures only by HTTP error rate. Usable responses are falling while the dashboard stays flat. What is the most likely blind spot?","options":["The dashboard refresh interval is too long to show a gradual decline in quality","The API is hiding its 5xx errors","Refusals and other unusable 200 responses aren't counted as failures","Streaming responses are never counted"],"answers":[2],"explanation":"A refusal arrives as a successful response with stop_reason 'refusal', and truncation as 'max_tokens'. A failure metric built on transport errors reads flat while usable output declines, so track these outcomes separately.","sources":["https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback"],"origin":"Community","sourceId":"260"},{"id":"C261","domain":"Applications and Integration","question":"Which three quantities should a Claude-backed service emit from its first day in production?","options":["Lines of code, commit count and team size per feature","Only the average response length","Only total monthly spend, taken from the provider's invoice","Cost per call, latency and failures, refusals included"],"answers":[3],"explanation":"Without cost, latency and failure telemetry (counting refusals and truncations as failures), nobody can say what the system costs or how often it fails usefully. Treat in-app cost figures as an approximation to trend; billing comes from the provider.","sources":[],"origin":"Community","sourceId":"261"},{"id":"C262","domain":"Applications and Integration","question":"Anthropic announces that the model your production system uses will retire on a stated date. What is the correct response?","options":["Plan the migration with an owner and a date, evaluated against the baseline","Wait until the retirement date and switch then","Switch immediately to the newest model without evaluation, before the window closes","Ignore it; deprecated models keep working indefinitely for customers with existing API keys"],"answers":[0],"explanation":"Anthropic gives at least 60 days' notice before retiring a publicly released model, and requests to retired models fail. Schedule the migration as planned work with an owner and a date inside the notice window. Deferring turns a planned migration into an outage; switching without an eval against the current baseline means you cannot tell what the swap cost.","sources":["https://platform.claude.com/docs/en/about-claude/model-deprecations"],"origin":"Community","sourceId":"262"},{"id":"C263","domain":"Applications and Integration","question":"Your system runs Claude on Amazon Bedrock. Whose retirement schedule applies to the model you use there?","options":["None; models on cloud platforms never retire","Bedrock's own published schedule","Whichever date is later","Only Anthropic's first-party schedule"],"answers":[1],"explanation":"Anthropic's deprecation dates apply to Anthropic-operated platforms. Amazon Bedrock and Google Cloud set their own schedules, so the same model can have a different lifecycle status depending on where it runs.","sources":["https://platform.claude.com/docs/en/about-claude/model-deprecations"],"origin":"Community","sourceId":"263"},{"id":"C264","domain":"Applications and Integration","question":"A new prompt version is ready. What should happen before it receives production traffic?","options":["Promote it to half the users and ask them which they prefer","Promote it if the new text reads better to the author","Score it against the current baseline on the evaluation set and promote only if it clears the gate","Promote it and watch production metrics for differences"],"answers":[2],"explanation":"A gate is real only if it can refuse, and it refuses against a named artifact such as an eval score versus baseline. Promoting first and observing production discovers regressions by shipping them.","sources":[],"origin":"Community","sourceId":"264"},{"id":"C265","domain":"Applications and Integration","question":"An on-call engineer discovers in production that users routinely paste documents in a format the requirements never mentioned. Where should this finding go?","options":["Into the incident log only","Into a private note for the next on-call shift, so they know to expect the format","Nowhere; production behaviour is not a requirement until a customer files a complaint","Into the requirements and eval set, as a gated change"],"answers":[3],"explanation":"Iteration means a production finding reaches the requirement it contradicts and re-enters development through a gate. Left in an incident record, it is knowledge held by one person.","sources":[],"origin":"Community","sourceId":"265"},{"id":"C266","domain":"Applications and Integration","question":"A team wants to skip the evaluation gate to hit a launch date. What is the strongest argument against it?","options":["A skipped gate fails silently, so first name what it would have caught","Evaluation gates make the model more accurate","The API will reject requests that use prompts which have not passed a registered evaluation gate","Gates are legally required for all AI systems"],"answers":[0],"explanation":"Skipping a gate raises no error: the system ships on time, but nobody knows what the gate would have stopped. Schedule pressure usually sounds stronger than an absent signal, so naming what the gate would have caught makes the trade-off explicit before anyone agrees to it.","sources":[],"origin":"Community","sourceId":"266"},{"id":"C101","domain":"Applications and Integration","question":"An application defines its own custom tool named 'get_weather' (name, description and input_schema) in its API request. Which of the following correctly describes what happens next?","options":["Claude may return a tool_use request; your application executes it and sends back the result","Claude executes 'get_weather' directly against the live backend itself","Tool definitions are purely documentation and never affect model behavior or the shape of the response","'get_weather' is executed automatically by Anthropic's servers with no application involvement"],"answers":[0],"explanation":"For a custom (client) tool, Claude does not execute anything itself. It returns a tool_use block with stop_reason 'tool_use', and the calling application runs the tool and sends the output back in a tool_result block in the next user message. Only Anthropic-provided server tools, such as web search, run on Anthropic's infrastructure.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"],"origin":"Community","sourceId":"101"},{"id":"C102","domain":"Applications and Integration","question":"An application defines its own custom tool named 'lookup_inventory' (name, description and input_schema) in its API request. Which of the following correctly describes what happens next?","options":["Claude may request a call to 'lookup_inventory'; the app runs it and returns the result","'lookup_inventory' is executed automatically by Anthropic's servers with no application involvement","Tool definitions are purely documentation and never affect model behavior","Claude executes 'lookup_inventory' directly against the live backend itself, then summarizes the result"],"answers":[0],"explanation":"For a custom (client) tool, Claude does not execute anything itself. It returns a tool_use block with stop_reason 'tool_use', and the calling application runs the tool and sends the output back in a tool_result block in the next user message. Only Anthropic-provided server tools, such as web search, run on Anthropic's infrastructure.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"],"origin":"Community","sourceId":"102"},{"id":"C103","domain":"Applications and Integration","question":"An application defines a tool named 'calculate_shipping' in its API request. Which of the following correctly describes what happens next?","options":["Tool definitions are purely documentation and never affect model behavior","'calculate_shipping' is executed automatically by Anthropic's servers with no application involvement","Claude executes 'calculate_shipping' directly against the live backend itself","Claude may request the call; the application executes it and returns the result"],"answers":[3],"explanation":"'calculate_shipping' is a user-defined (client) tool, so Claude does not execute it: Claude returns a tool_use block with the tool name and generated input, and the calling application executes the tool and sends the result back as a tool_result content block in a user message. Only Anthropic-provided server tools, such as web search or code execution, run on Anthropic's infrastructure.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"],"origin":"Community","sourceId":"103"},{"id":"C104","domain":"Applications and Integration","question":"Regarding the tool 'get_weather' defined in an API request, select the TWO true statements.","options":["Claude decides whether and when to call the tool based on the conversation and the tool's description/schema","A single API request can only ever define one tool","The application must execute the tool call and return its result for the conversation to continue meaningfully","Tool results must be sent back as a new 'system' role message"],"answers":[0,2],"explanation":"Claude autonomously decides when a defined tool is relevant (A); multiple tools can be defined per request (so B is false); execution and returning results is the application's job (C); tool results go back as a 'user' message with a tool_result content block, not a system message (so D is false).","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls","https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"],"origin":"Community","sourceId":"104"},{"id":"C105","domain":"Applications and Integration","question":"A tool executes but raises an exception. How should this be reported back to the model?","options":["Return a successful result containing an empty value","Return a tool result flagged as an error, describing what went wrong","Abort the conversation and start a new one","Omit the result and send only a user message describing the problem"],"answers":[1],"explanation":"Returning a result marked as an error, with a description, lets the model adapt — retry with different arguments, choose another tool, or explain the failure. Silently returning empty success invites wrong conclusions.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"],"origin":"Community","sourceId":"105"},{"id":"C106","domain":"Applications and Integration","question":"A response contains two tool-use blocks. What must the next request include?","options":["No results, since parallel calls are executed server-side","A result for the first call only, deferring the second","A single merged result covering both calls under one identifier","A tool_result for each call, each echoing its tool_use_id, together in the next user message"],"answers":[3],"explanation":"Every tool_use block must be answered by its own tool_result (matched by tool_use_id) before the conversation can continue. Return them together in one user message; splitting them across messages works against parallel tool use.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use","https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"],"origin":"Community","sourceId":"106"},{"id":"C107","domain":"Applications and Integration","question":"What makes a tool description important to the quality of tool use?","options":["It is shown to end users in the interface","It is used only for API documentation and has no runtime effect","It determines the tool's execution timeout","It is the primary basis on which the model decides whether and how to call the tool"],"answers":[3],"explanation":"The description and parameter schema are the model's only information about a tool's purpose and correct use, so vague descriptions are a leading cause of wrong or missing calls.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"],"origin":"Community","sourceId":"107"},{"id":"C108","domain":"Applications and Integration","question":"Select the TWO accurate statements about defining tools on a request.","options":["The API executes a defined tool automatically and returns its output","Several tools may be defined on a single request and the model chooses among them","Only one tool definition is permitted per request","The model generates the tool's arguments but the application performs the execution"],"answers":[1,3],"explanation":"Multiple tools can be offered and the model selects; it produces the arguments while the caller executes. The API never runs a tool itself, and there is no single-tool limit.","sources":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"],"origin":"Community","sourceId":"108"},{"id":"C315","domain":"Applications and Integration","question":"In a tool result turn, a developer adds a text block after the tool_result blocks saying 'Here is the result'. Over time responses come back empty with stop_reason 'end_turn'. What is the likely cause?","options":["Text after tool results trains it to expect user input after tool use","The API strips text after tool results","Empty responses always mean a rate limit was hit, with the content silently dropped","The tool_use_id was wrong"],"answers":[0],"explanation":"A tool-result turn should carry only the tool_result blocks for the calls it answers. Adding text right after them teaches the model to expect user input after every tool use, and is a documented cause of empty end_turn responses.","sources":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons","https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"],"origin":"Community","sourceId":"315"},{"id":"C59","domain":"Model Selection and Optimization","question":"A team wants to integrate Claude into a Python codebase. Which statement is accurate?","options":["Claude can only be accessed through a graphical interface, never programmatically","Raw HTTP calls to the API are blocked and require an SDK","Only Python is capable of calling the Claude API","Official client SDKs exist for common languages, and for any language the underlying Messages API can be called directly over HTTP"],"answers":[3],"explanation":"Anthropic provides official SDKs for common languages, and since the API is a standard HTTP/JSON interface, any language capable of making HTTP requests can integrate directly.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"59"},{"id":"C68","domain":"Model Selection and Optimization","question":"A single user turn must carry an instruction, a PDF contract and two screenshots. How is this expressed in a Messages API request?","options":["As four separate API calls, one per item, whose answers the application merges","As one user message whose content is a list of typed blocks: document, image, image, and text","By base64-encoding everything into the system prompt","Through the legacy Text Completions endpoint, which accepts attachments"],"answers":[1],"explanation":"Message content is a list of typed content blocks, so text, images and documents travel together through the one Messages endpoint. Anthropic recommends placing long documents and images before the instruction text.","sources":["https://platform.claude.com/docs/en/build-with-claude/pdf-support","https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"68"},{"id":"C69","domain":"Model Selection and Optimization","question":"A team wants to integrate Claude from a language with no official SDK. What is the most direct path?","options":["Call the HTTP/JSON endpoints directly from that language","Rewrite the service in a language that has an official SDK","Route calls through a browser automation harness","Wait for an official SDK, since direct HTTP access is not supported"],"answers":[0],"explanation":"The API is a standard HTTP/JSON interface, so any language capable of issuing HTTP requests can integrate without an SDK.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"69"},{"id":"C70","domain":"Model Selection and Optimization","question":"Where should an API key live in a production deployment?","options":["In the client-side bundle so the browser can call the API directly and reduce hops","Committed to the repository so every environment stays in sync","In server-side configuration or a secret manager, with requests proxied through your backend","Embedded in the mobile binary, obfuscated"],"answers":[2],"explanation":"Keys must stay server-side in configuration or a secret store, with the application proxying calls; anything shipped to a client is retrievable by users.","sources":[],"origin":"Community","sourceId":"70"},{"id":"C341","domain":"Model Selection and Optimization","question":"Which headers are required on a raw HTTP call to the Messages API?","options":["A credential, anthropic-version and content-type: application/json","No headers; everything, including the key and version, goes in the JSON body of the request","Only the API key","anthropic-model and accept-language, with the model ID in the header instead of the body"],"answers":[0],"explanation":"Raw calls need a credential (x-api-key or an Authorization bearer token), anthropic-version and content-type: application/json. The official SDKs send these automatically. A missing or wrong header fails identically on every attempt, which is how you recognise an integration-seam failure.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"341"},{"id":"C342","domain":"Model Selection and Optimization","question":"A team starts a new Python integration and proposes wrapping a generic HTTP library because 'it's only three headers'. What is the main argument for the official SDK?","options":["The SDK makes tokens cheaper","It maintains retries, typed errors, timeouts and API changes for you","The SDK reaches a smarter model than raw HTTP calls to the same endpoint","Raw HTTP calls are blocked"],"answers":[1],"explanation":"The SDK and a hand-written call reach the same endpoint and model. What changes is who maintains the boilerplate (typed exceptions, a default retry policy, timeouts and keep-alive, pagination, request IDs) as the API moves; a hand-rolled client becomes a private fork.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"342"},{"id":"C343","domain":"Model Selection and Optimization","question":"Why is calling Claude through an OpenAI-compatible shim a weak default for a new Claude-only application?","options":["Shims are illegal under the API terms, so the account could be suspended for using one","The shim is always more expensive per token than calling the Messages API directly","It adds a layer to debug and can hide Claude-specific features","Shims cannot send text"],"answers":[2],"explanation":"Compatibility layers are not general-purpose Messages API clients: they add a layer to debug and can hide Claude-specific features, for a provider switch nobody scheduled. Portability is a real requirement only when it is real. For a Claude-only project, the native SDK gives full feature access without a translation layer.","sources":["https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk"],"origin":"Community","sourceId":"343"},{"id":"C344","domain":"Model Selection and Optimization","question":"How does the API know which model to use for a request?","options":["A separate endpoint per model","The model is chosen automatically from the prompt","The model is fixed per API key","The required model field in the JSON body, alongside max_tokens and messages"],"answers":[3],"explanation":"Every Messages request names a model, a max_tokens ceiling, and a messages list; standing instructions go in the top-level system field. On some cloud platforms the model moves into the URL, but the message shape is unchanged.","sources":["https://platform.claude.com/docs/en/api/overview","https://platform.claude.com/docs/en/build-with-claude/effort"],"origin":"Community","sourceId":"344"},{"id":"C122","domain":"Model Selection and Optimization","question":"A workload is not latency-sensitive and can tolerate being processed within a multi-hour window. Which combination of optimizations would most reduce cost?","options":["Use synchronous real-time calls to guarantee lowest cost","Use only the largest model with no caching","Use the Message Batches API and apply prompt caching where inputs share static content","Disable caching to simplify the architecture"],"answers":[2],"explanation":"Combining Batches API discounts with prompt caching for shared static content stacks cost savings for delay-tolerant, high-repetition workloads.","sources":["https://platform.claude.com/docs/en/api/overview","https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"122"},{"id":"C123","domain":"Model Selection and Optimization","question":"A customer-facing chatbot must minimize cost while keeping answer quality acceptable. Which strategy fits best?","options":["Route all chat traffic through the Batches API for the 50% discount, since replies arrive within minutes","Always use the most capable tier so quality can never be questioned","The cheapest tier that passes an eval of real conversations, plus a cached system prompt","Disable all monitoring to reduce overhead"],"answers":[2],"explanation":"A user is waiting, so batch is unavailable. The defensible lever is evidence: the cheapest tier (or effort level) that passes an eval of representative traffic, plus caching the stable prefix so repeated system-prompt tokens bill at the read rate.","sources":["https://platform.claude.com/docs/en/about-claude/pricing"],"origin":"Community","sourceId":"123"},{"id":"C124","domain":"Model Selection and Optimization","question":"A high-volume triage classifier runs as an overnight job, and minimizing per-request cost is the top priority. Which configuration fits best?","options":["A light tier at low effort with a short constrained output, submitted through the Batches API","The most capable tier at maximum effort, called synchronously","Streaming responses, so tokens are cheaper","Always the same model and settings as every other workload"],"answers":[0],"explanation":"Simple classification rarely needs a large model or deep thinking, a short label keeps output tokens low, and an unattended overnight run qualifies for the batch discount. Streaming changes delivery, not price.","sources":["https://platform.claude.com/docs/en/build-with-claude/effort","https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"124"},{"id":"C125","domain":"Model Selection and Optimization","question":"A triage classifier sits in a user's request path, and minimizing response latency is the top priority. Which configuration fits best?","options":["Submit each request through the Batches API","A lighter tier at low effort, a short output, and a cached static prefix","The most capable tier at maximum effort, to avoid retries","A larger max_tokens value so the response is never truncated"],"answers":[1],"explanation":"Latency falls with a lighter model, less thinking, fewer output tokens, and a cached prefix (which shortens time to first token). Batch is asynchronous and unsuitable when a request is waiting; max_tokens is a ceiling, not a speed control.","sources":["https://platform.claude.com/docs/en/build-with-claude/effort","https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"125"},{"id":"C126","domain":"Model Selection and Optimization","question":"A triage workload's top priority is reasoning quality on ambiguous, high-stakes inputs, with relaxed cost limits. Which configuration fits best?","options":["A more capable tier and/or higher effort, verified on the hardest cases","The cheapest tier, compensated by a longer system prompt full of extra reasoning instructions","A very low max_tokens value to keep answers focused","Raising temperature to explore more interpretations of each ambiguous input"],"answers":[0],"explanation":"When quality on hard cases dominates, capability (tier) and deliberation (effort) are the levers, and an eval on the hardest slice is what shows they paid off. Sampling settings do not add reasoning, and on Claude 4.7 and later non-default temperature is rejected.","sources":[],"origin":"Community","sourceId":"126"},{"id":"C127","domain":"Model Selection and Optimization","question":"A nightly job re-scores 200,000 archived documents. Cost matters; completion by morning is sufficient. Which configuration fits best?","options":["Synchronous calls with streaming enabled","Synchronous calls with extended thinking enabled for accuracy","Synchronous calls at maximum concurrency","Batch submission, accepting asynchronous turnaround for the reduced rate"],"answers":[3],"explanation":"High volume with a tolerant deadline is exactly the batch profile: the discount applies and nothing is waiting on the result.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"127"},{"id":"C128","domain":"Model Selection and Optimization","question":"A team proposes routing an interactive support chat through batch processing to halve costs. What is the decisive objection?","options":["Batch requests are billed at a premium for conversational input","Batch results cannot be parsed programmatically","Batch processing does not support system prompts","Batch turnaround is asynchronous and unsuitable for a user waiting on a reply"],"answers":[3],"explanation":"The discount is compensation for relaxed turnaround. A live conversation cannot absorb asynchronous processing, so the saving is unavailable at any acceptable user experience.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"128"},{"id":"C129","domain":"Model Selection and Optimization","question":"Select the TWO statements that correctly describe the batch/synchronous tradeoff.","options":["Batch reduces per-request cost in exchange for relaxed completion timing","Synchronous requests are the right choice whenever a human is waiting on the output","Batch improves per-request latency compared with synchronous calls","Batch and synchronous requests are priced identically"],"answers":[0,1],"explanation":"Batch trades timing for cost and suits unattended work; synchronous suits interactive use. It does not improve latency, and the two are not priced alike.","sources":["https://platform.claude.com/docs/en/api/overview","https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"129"},{"id":"C130","domain":"Model Selection and Optimization","question":"A pipeline is partly interactive and partly bulk backfill. What is the most cost-effective architecture?","options":["Route everything synchronously for operational simplicity","Route everything through batch and add a spinner to the interactive path","Split the workload, sending the interactive path synchronously and the backfill through batch","Alternate between the two modes on a fixed schedule"],"answers":[2],"explanation":"Mode should follow each path's latency requirement. Splitting captures the discount where deadlines are loose without degrading the interactive experience.","sources":["https://platform.claude.com/docs/en/api/overview"],"origin":"Community","sourceId":"130"},{"id":"C131","domain":"Model Selection and Optimization","question":"Your application repeats roughly 10% of its input tokens (e.g., shared instructions/context) across many requests. Which optimization most directly reduces cost here?","options":["Increasing max_tokens","Adding more tools to the request","Switching all requests to streaming","Prompt caching for the repeated portion of the input"],"answers":[3],"explanation":"Prompt caching specifically targets repeated static content, cutting cost and latency for the cached portion on subsequent calls.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"131"},{"id":"C132","domain":"Model Selection and Optimization","question":"An application's spend is dominated by a 30,000-token reference manual resent with every request. Which lever addresses this most directly?","options":["Cache the manual as a stable prefix so repeat requests read it cheaply","Raise the output token ceiling","Move to a more capable model tier","Enable streaming to spread cost over time"],"answers":[0],"explanation":"A large unchanging prefix resent on every call is the textbook caching case. Neither the ceiling, the tier, nor streaming affects the repeated input cost.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md"],"origin":"Community","sourceId":"132"},{"id":"C133","domain":"Model Selection and Optimization","question":"Which sequence reflects a sound cost-optimization process?","options":["Measure where tokens are actually spent, then apply the lever matching the dominant cost","Disable logging and monitoring to cut overhead","Reduce the token ceiling until responses fit the budget","Adopt the cheapest tier immediately and accept whatever quality results"],"answers":[0],"explanation":"Optimization starts with measurement: repeated input calls for caching, verbose output for length control, over-provisioned reasoning for a cheaper tier. Guessing at levers wastes effort.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md"],"origin":"Community","sourceId":"133"},{"id":"C134","domain":"Model Selection and Optimization","question":"Why are input and output tokens considered separately when modeling cost?","options":["Only output tokens count toward the context window","Output tokens are free below a threshold","Input tokens are not billed when a system prompt is present","They are billed at different rates, so the dominant direction determines the right lever"],"answers":[3],"explanation":"Because the two directions are priced differently, an input-heavy workload and an output-heavy one call for different remedies — caching and trimming context versus constraining response length.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md"],"origin":"Community","sourceId":"134"},{"id":"C135","domain":"Model Selection and Optimization","question":"A tiered routing design sends simple requests to a cheap model and escalates hard ones. What is the main risk to manage?","options":["Cheaper tiers cannot accept system prompts","Misclassification, where hard requests are answered poorly by the cheap tier","Escalation doubles the context window requirement","Routing is not permitted within a single application"],"answers":[1],"explanation":"The saving depends on the router's accuracy. A weak classifier sends difficult work to an under-powered tier, so the routing decision itself needs evaluation.","sources":[],"origin":"Community","sourceId":"135"},{"id":"C136","domain":"Model Selection and Optimization","question":"Select the TWO changes that reduce cost without altering the model tier.","options":["Caching a large static instruction block reused across requests","Constraining response length where verbose output adds no value","Setting effort to max on every request regardless of task difficulty","Resending the full conversation history on every turn regardless of relevance"],"answers":[0,1],"explanation":"Caching stable input and trimming unnecessary output both cut spend at a fixed tier. Running every request at maximum effort removes constraints on token spending, and resending irrelevant history grows input tokens on every turn; both increase cost.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md","https://platform.claude.com/docs/en/build-with-claude/effort","https://platform.claude.com/docs/en/api/openai-sdk"],"origin":"Community","sourceId":"136"},{"id":"C137","domain":"Model Selection and Optimization","question":"A summarization endpoint returns responses far longer than the UI displays. What is the most direct saving?","options":["Switch to batch processing","Constrain the requested length so generation stops near what is actually rendered","Cache the output for reuse","Increase the token ceiling to avoid truncation retries"],"answers":[1],"explanation":"Paying to generate text the interface discards is pure waste; bounding requested length aligns generation with what is consumed. Caching applies to repeated input, not fresh summaries.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md"],"origin":"Community","sourceId":"137"},{"id":"C345","domain":"Model Selection and Optimization","question":"Before launch, a team needs a monthly cost projection. Which quantities are required?","options":["Volume, input and output tokens per request, rates, and cache share","Only the number of users","A per-request figure copied from another product with a similar user count","Only the per-token input price, since output tokens are billed at the same flat rate"],"answers":[0],"explanation":"The projection needs request volume, input tokens per request, output tokens per request, the per-token rates for the chosen model, and the expected share of input served from cache. All five are knowable before launch. The token counting endpoint returns input token counts for free, without running inference.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"345"},{"id":"C346","domain":"Model Selection and Optimization","question":"Spend is rising and nobody can say which feature drives it. What is the first step?","options":["Move every feature to the cheapest model tier at once, then restore the ones that break","Instrument token usage per call by feature, then target the biggest cost","Accept the growth as unavoidable","Cut max_tokens across every feature"],"answers":[1],"explanation":"Attribution precedes optimisation: record tokens in, tokens out and cache reads per call, by feature. Every remedy without it is across-the-board and damages features that never drove spend.","sources":[],"origin":"Community","sourceId":"346"},{"id":"C347","domain":"Model Selection and Optimization","question":"In a long conversation, cost per exchange climbs steadily even though each user message is short. Which lever addresses this without losing needed history?","options":["Truncate to the last turn","Summarise every single turn into one sentence, discarding the original messages","Cache the stable prefix so resent history bills at the read rate","Lower max_tokens"],"answers":[2],"explanation":"Because every turn resends the whole history, cost grows roughly with the square of turn count. Caching reuses the prefix instead of deleting context the conversation still needs.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"347"},{"id":"C348","domain":"Model Selection and Optimization","question":"To cap spend, a team lowers max_tokens on an agent's requests. Hard tasks now fail partway, and spend barely falls. Why?","options":["Lower max_tokens always increases the price per token on the remaining output","max_tokens only affects streaming responses, so non-streaming agent calls ignore the lower value","The model ignores max_tokens","The model can't see max_tokens; it just truncates work already paid for"],"answers":[3],"explanation":"Cutting the ceiling discards the turn that needed the room and still bills its tokens. Spend control that changes behaviour must be something the model can see: a visible budget (such as a task budget) paces the work, with a hard limit behind it.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence","https://platform.claude.com/docs/en/build-with-claude/task-budgets"],"origin":"Community","sourceId":"348"},{"id":"C325","domain":"Model Selection and Optimization","question":"Which three settings are separate controls, yet are often confused as one 'quality dial'?","options":["Model choice, thinking and effort","Streaming, batching and caching","Temperature, top_p and top_k","max_tokens, stop sequences and system prompt length"],"answers":[0],"explanation":"Model choice is the capability tier. Thinking is whether the model reasons in thinking blocks before answering. Effort is how much work it puts into the whole response, including how often and how deeply it thinks. A larger model buys capability; thinking and effort buy deliberation on the same model. Some models can't turn thinking off, which leaves effort as the main lever. Fast mode is separate again: a speed setting at premium pricing on supported models.","sources":["https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost","https://platform.claude.com/docs/en/models/opus-5-5/whats-new-opus-5-5","https://platform.claude.com/docs/en/build-with-claude/thinking","https://platform.claude.com/docs/en/build-with-claude/effort","https://platform.claude.com/docs/en/build-with-claude/fast-mode"],"origin":"Community","sourceId":"325"},{"id":"C326","domain":"Model Selection and Optimization","question":"Output quality is already acceptable, but responses from a supported Opus model are too slow for an interactive feature, and budget allows a premium. Which option changes inference speed without switching to a model with different capabilities?","options":["Submit through the Batches API","Fast mode","Raise effort to maximum","Switch to a smaller tier"],"answers":[1],"explanation":"Fast mode uses a faster inference configuration for a supported model at premium pricing, retaining that model capability profile. This does not promise identical sampled text or the same time to first token. Availability, access requirements and supported platforms are model-specific and change over time; check the current fast-mode documentation. Batch processing is asynchronous. Editorial correction, 3 November 2026.","sources":["https://platform.claude.com/docs/en/build-with-claude/fast-mode"],"origin":"Community","sourceId":"326"},{"id":"C327","domain":"Model Selection and Optimization","question":"Which workloads typically repay a higher effort setting?","options":["High-volume chit-chat where latency matters most","Simple classification","Coding and long-horizon agentic work","Echoing or reformatting a string"],"answers":[2],"explanation":"Effort trades thoroughness for tokens. Coding and agentic tasks respond strongly; chat and classification often do well at low effort. Tune per route on measured results.","sources":["https://platform.claude.com/docs/en/build-with-claude/effort"],"origin":"Community","sourceId":"327"},{"id":"C328","domain":"Model Selection and Optimization","question":"An integration built for an older model sends thinking: {type: 'enabled', budget_tokens: 8000}. It now targets Claude Opus 5.5. What happens and what is the fix?","options":["It works unchanged with an 8,000-token reasoning budget, as on every earlier model","The budget is silently converted to max_tokens and the request runs without thinking","Thinking is disabled and the request succeeds","A 400 error; switch to adaptive thinking and use output_config.effort"],"answers":[3],"explanation":"Fixed thinking budgets are deprecated on the 4.6 models and removed on newer ones, so the request is rejected with a 400. Use adaptive thinking (or omit the parameter) and control depth with output_config.effort. On Opus 5.5 thinking is always on and effort is the control; its default effort is medium, so set it explicitly.","sources":["https://platform.claude.com/docs/en/build-with-claude/extended-thinking","https://platform.claude.com/docs/en/api/errors","https://platform.claude.com/docs/en/models/opus-5-5/whats-new-opus-5-5"],"origin":"Community","sourceId":"328"},{"id":"C329","domain":"Model Selection and Optimization","question":"On current models the default thinking display is 'omitted', so thinking blocks arrive with empty text. What does that mean for cost?","options":["Nothing changes: the thinking is still billed","Thinking is skipped when its display is omitted","Omitted thinking halves output cost","Omitted thinking is free"],"answers":[0],"explanation":"Thinking still happens and is billed; the display setting controls only visibility. If you stream reasoning to users, the default looks like a pause before output, so request a summarized display. Either way, the tokens are billed.","sources":["https://platform.claude.com/docs/en/build-with-claude/thinking"],"origin":"Community","sourceId":"329"},{"id":"C467","domain":"Model Selection and Optimization","question":"Before building a multi-model cascade to cut costs, what simpler alternative should be measured first?","options":["Running every request twice and picking one","The most capable model at a lower effort setting on the same tasks","Using the oldest available model","Disabling all caching"],"answers":[1],"explanation":"Lower effort on a newer model often matches higher effort on older models, and one model keeps one cache namespace, whereas a cascade forfeits cache reuse across models.","sources":["https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence.md","https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback"],"origin":"Community","sourceId":"467"},{"id":"C54","domain":"Model Selection and Optimization","question":"An application receives an HTTP 400 (invalid_request_error) from the Claude API. What is the correct handling strategy?","options":["Treat it as a problem with the request itself (format, content, or a limit you set), fix the request, and do not retry it unchanged","Immediately stop using the API entirely and switch providers","Resend the identical request in a tight loop until it succeeds","Back off exponentially and retry the same request, since all errors are transient"],"answers":[0],"explanation":"A 400 is deterministic: the same bytes fail the same way on every attempt, so retrying with backoff only pays repeatedly for the same answer. Note it is a catch-all for 4xx conditions without their own code, and a spend limit you set on an organization or workspace also returns a 400, so it is not always proof of a malformed body.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"54"},{"id":"C55","domain":"Model Selection and Optimization","question":"An application receives an HTTP 401 (authentication_error) from the Claude API. What is the correct handling strategy?","options":["Retry with exponential backoff, since authentication failures clear on their own","Treat all non-200 responses identically regardless of code","Check the credential: the API key is missing, malformed, revoked or expired, and retrying will not change the outcome","Increase max_tokens so the request is accepted"],"answers":[2],"explanation":"A 401 means the credential is bad. It fails identically on every attempt, so the fix is a valid key (or a refreshed token), not a retry. Compare 403, where the key is valid but lacks permission for the resource.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"55"},{"id":"C56","domain":"Model Selection and Optimization","question":"An application receives an HTTP 429 (rate_limit_error) from the Claude API. What is the correct handling strategy?","options":["Treat all non-200 responses identically regardless of code, by failing the request immediately","Rotate across several API keys in the same organization so each request draws on a fresh limit","Back off with increasing delays, honoring retry-after, with capped attempts","Resend the identical request immediately in a tight loop"],"answers":[2],"explanation":"A 429 is usually transient, so bounded retries with exponential backoff that honor retry-after are correct. Two gotchas: the official SDKs already retry 429s twice by default, so wrapping them in your own loop multiplies attempts; and a 429 caused by a usage tier's monthly spend cap carries no retry-after and keeps failing until access resumes.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"56"},{"id":"C57","domain":"Model Selection and Optimization","question":"An application receives an HTTP 500 (api_error) from the Claude API. What is the correct handling strategy?","options":["Immediately stop using the API entirely and switch providers","Retry with exponential backoff; if it persists, contact support with the request-id","Rewrite the request body before retrying, since a 500 always means the payload was malformed","Resend the identical request in a tight loop with no delay"],"answers":[1],"explanation":"A 500 is an internal error on Anthropic's side. The documented handling is to retry with exponential backoff and, if it persists, contact support with the request-id from the response, which is the only identifier that names a single call.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"57"},{"id":"C58","domain":"Model Selection and Optimization","question":"An application receives an HTTP 529 (overloaded_error) from the Claude API. What is the correct handling strategy?","options":["Treat it as temporary service-wide overload: back off and retry with exponential backoff and a cap on attempts","Immediately stop using the API entirely and switch providers","Fix the request body, since a 529 means the request was malformed","Treat all non-200 responses identically regardless of code"],"answers":[0],"explanation":"A 529 reports that the API is temporarily overloaded across users. It is transient, so bounded backoff-and-retry is correct; nothing about your request needs fixing.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"58"},{"id":"C60","domain":"Model Selection and Optimization","question":"A client is being rate limited. Which retry behavior is most appropriate?","options":["Switch to a different model on every retry attempt","Fail the user's request permanently on the first rate-limit response","Back off with increasing delays and jitter, honoring any retry-after guidance in the response","Retry immediately in a tight loop until a request succeeds"],"answers":[2],"explanation":"Exponential backoff with jitter, respecting retry-after guidance, drains the queue without amplifying congestion. Tight retry loops make the limit worse.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"60"},{"id":"C61","domain":"Model Selection and Optimization","question":"Select the TWO status codes for which retrying the identical request is a reasonable strategy.","options":["401","429","529","400"],"answers":[1,2],"explanation":"Rate limiting (429) and temporary overload (529) are transient, so the same request may succeed later, and so may a 500. A malformed request (400) and an authentication failure (401) fail identically on every attempt and need the request or the credential fixed.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"61"},{"id":"C334","domain":"Model Selection and Optimization","question":"A team wraps the official SDK's calls in their own retry loop of three attempts. Under load, the service sees far more traffic than expected. Why?","options":["SDKs never retry on their own, so the custom loop is required and cannot be the cause","The SDK already retries, so the nested loops multiply attempts","The SDK's retries cannot be changed or disabled","The SDK retries only connection errors, never 429s"],"answers":[1],"explanation":"The client libraries retry connection errors, 408, 409, 429 and 5xx (twice by default) with exponential backoff, honouring retry-after. Three outer attempts around three inner ones is up to nine requests against a service that asked for a pause. Configure the SDK's max_retries instead of wrapping it.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"334"},{"id":"C335","domain":"Model Selection and Optimization","question":"A batch job retries a 429 indefinitely. The 429 has no retry-after header and never clears. What is likely happening?","options":["A bug in the SDK","A malformed request body that the API reports as a 429 instead of a 400","The usage tier's monthly spend cap was reached","A temporary traffic spike that will clear within seconds"],"answers":[2],"explanation":"Not every 429 is transient. A 429 from hitting the usage tier's monthly spend cap keeps failing until access resumes, so unbounded retries turn a billing problem into an outage. Always bound retries and alert when a 429 persists, especially one without retry-after.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"335"},{"id":"C336","domain":"Model Selection and Optimization","question":"Which status code means the API key is valid but not permitted to use the requested resource?","options":["404 not_found_error","429 rate_limit_error","401 authentication_error","403 permission_error"],"answers":[3],"explanation":"401 means the key itself is bad, 402 is a billing problem, 403 is a valid key lacking permission (for example workspace access). None of them succeed on retry.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"336"},{"id":"C337","domain":"Model Selection and Optimization","question":"A request with several large images and PDFs fails with 413 request_too_large. What is the fix?","options":["Shrink the request or reference files via the Files API","Lower the temperature","Retry with exponential backoff until the upload bandwidth frees up","Switch to a model with a larger context window"],"answers":[0],"explanation":"413 is deterministic: the request exceeds the endpoint's byte limit (32 MB for Messages, larger for Batches and Files). It is rejected before reaching the model.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"337"},{"id":"C338","domain":"Model Selection and Optimization","question":"Which error-handling style does Anthropic recommend in the official SDKs?","options":["Ignore exceptions; the SDK retries everything forever until it succeeds","Catch the typed exception classes, most specific first","Catch every exception with one broad handler and retry it","Parse the English error message for keywords"],"answers":[1],"explanation":"Catch the SDK's typed exception classes, most specific first (for example not-found, then rate-limit, then generic API status errors). A single broad catch loses the distinction between retryable (429, 5xx, connection) and non-retryable (400, 404) failures. Message wording is not part of the contract; exception types are.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"338"},{"id":"C339","domain":"Model Selection and Optimization","question":"What should an application log when an API call fails so that support can investigate that exact call?","options":["The local machine's hostname and process ID","Only the HTTP status code and timestamp","The request-id from the response","The full API key"],"answers":[2],"explanation":"The request-id, returned on every response and also in error bodies, is the only identifier that names a single call. Never log the API key.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"339"},{"id":"C340","domain":"Model Selection and Optimization","question":"A non-streaming request with a very large max_tokens repeatedly fails with a timeout on some networks. What is the recommended approach?","options":["Retry the same non-streaming request in a tight loop until one gets through","Lower the temperature","Split the system prompt across two requests","Use streaming, or the Batches API for long generations"],"answers":[3],"explanation":"Long non-streaming requests risk idle-connection drops and the SDK's 10-minute expectation. Streaming keeps data flowing (the SDK can still assemble the final message); batches let you poll instead of holding a connection.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"340"},{"id":"C317","domain":"Model Selection and Optimization","question":"A teammate reports that the same request, sent twice byte-for-byte, returned differently worded answers, and wants to open a bug. What is the right response?","options":["Pin the model version, which makes outputs identical","Explain that sampling makes outputs vary, and make the app tolerant of it","Agree it is a bug in request construction and investigate the HTTP client for hidden differences","Explain that it is expected and close the ticket with no further action"],"answers":[1],"explanation":"Run-to-run variation is a property of generation, not a defect: tokens are sampled, so identical inputs can produce different outputs, even at temperature 0. The complete answer names the mechanism and then says what the application does about it (validate, retry on failure, or constrain the output shape); stopping at 'that is expected' ships nothing.","sources":["https://platform.claude.com/docs/en/about-claude/glossary","https://platform.claude.com/docs/en/models/opus-5-5/migration-guide"],"origin":"Community","sourceId":"317"},{"id":"C318","domain":"Model Selection and Optimization","question":"A contract is too long to fit in one request, and references in section 9 must resolve against definitions in section 2. A colleague suggests raising the temperature. What is wrong with that suggestion?","options":["Raising max_tokens would let the full contract fit as input, so temperature isn't needed","Temperature should be lowered instead to fit more text","Temperature changes token selection, not how much input fits","Nothing; higher temperature lets the model read more text from each section of the contract"],"answers":[2],"explanation":"Temperature selects; the window holds. This is a capacity problem that needs both sections in the same request, or a deliberate split that carries the needed state. Sampling settings, latency improvements and output caps all act on generation, not on input capacity. On Claude 4.7 and later, non-default temperature is rejected anyway.","sources":["https://platform.claude.com/docs/en/about-claude/glossary","https://platform.claude.com/docs/en/build-with-claude/context-windows"],"origin":"Community","sourceId":"318"},{"id":"C319","domain":"Model Selection and Optimization","question":"Roughly how many English characters does one Claude token represent?","options":["Exactly one word","About 20 characters, roughly four words","Exactly one character, including spaces","About 3.5, varying by language"],"answers":[3],"explanation":"Tokens map to words, subwords, characters or bytes. Input, output and thinking are all measured in tokens, which is the unit you are billed in and limited by. Use the token counting endpoint rather than estimating for anything important.","sources":["https://platform.claude.com/docs/en/about-claude/glossary","https://platform.claude.com/docs/en/build-with-claude/token-counting"],"origin":"Community","sourceId":"319"},{"id":"C320","domain":"Model Selection and Optimization","question":"What is 'context rot'?","options":["Accuracy and recall degrading as the context window fills","The deletion of old messages by the API after a timeout","Corruption of cached prompts over time","A security attack that gradually edits the system prompt over a long session"],"answers":[0],"explanation":"Context rot is the degradation of accuracy and recall as the window fills, because the window behaves as working memory rather than storage. A bigger window holds more but does not make every token equally attended. Keep the window focused: prune spent tool output, compact, and retrieve only what is relevant.","sources":["https://platform.claude.com/docs/en/build-with-claude/context-windows"],"origin":"Community","sourceId":"320"},{"id":"C321","domain":"Model Selection and Optimization","question":"Select the TWO statements about request settings that are accurate.","options":["A larger context window makes wording more consistent between runs","max_tokens caps how long the response may run; it does not change how much input fits","Effort controls how many tokens the model spends reasoning and responding; it does not enlarge the context window","Raising temperature lets more input fit in the window"],"answers":[1,2],"explanation":"Treat each dial as a separate machine: sampling selects tokens, the window bounds input, max_tokens bounds output, effort bounds deliberation. Wrong answers in this area apply a real dial to the wrong problem.","sources":["https://platform.claude.com/docs/en/build-with-claude/context-windows","https://platform.claude.com/docs/en/build-with-claude/effort"],"origin":"Community","sourceId":"321"},{"id":"C322","domain":"Model Selection and Optimization","question":"A team has 15 labelled examples of exactly the output they want and a model that keeps getting edge cases wrong. Which approach should they try first?","options":["Train a custom model on the 15 examples","Put a selection of those examples in the prompt (few-shot)","Warn users to avoid the edge cases","Store the examples in a database the model never reads"],"answers":[1],"explanation":"Examples in the prompt are the cheapest mechanism that fits: nothing needs to be built before trying it. Reaching for training or retrieval infrastructure spends the same information through a far more expensive channel.","sources":["https://platform.claude.com/docs/en/about-claude/glossary","https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"],"origin":"Community","sourceId":"322"},{"id":"C323","domain":"Model Selection and Optimization","question":"Which statement best describes the context window?","options":["It applies only to output tokens","It limits only the user's latest message, not the history or the system prompt","It bounds all tokens in one request, including the response","It is unlimited when prompt caching is enabled, since cached tokens are not counted"],"answers":[2],"explanation":"Everything competes for one budget: system prompt, messages, tool definitions, images, documents and the response itself. Cached prefixes still occupy it: caching changes price, not space.","sources":["https://platform.claude.com/docs/en/build-with-claude/context-windows"],"origin":"Community","sourceId":"323"},{"id":"C324","domain":"Model Selection and Optimization","question":"On Claude Opus 4.7 and later, a migrated integration sends temperature: 0.2 and gets an error. Why?","options":["The account has exceeded its temperature quota for the current billing period","Temperature is only allowed when streaming","Temperature must be an integer","Non-default sampling parameters are rejected with a 400 on these models"],"answers":[3],"explanation":"Sampling parameters (temperature, top_p, top_k) are deprecated on Claude 4.7 and later, and non-default values are rejected with a 400; remove them and steer behaviour through prompting. Migration breaks like this show up loudly as 400s; plan for them when changing model IDs.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide"],"origin":"Community","sourceId":"324"},{"id":"C138","domain":"Model Selection and Optimization","question":"What distinguishes latency from throughput in an integration?","options":["They are synonymous when concurrency is fixed","Throughput measures the size of the context window","Latency is time to complete one request; throughput is volume completed per unit time","Latency applies to input tokens and throughput to output tokens"],"answers":[2],"explanation":"Latency
