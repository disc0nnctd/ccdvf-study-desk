*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--paper);color:var(--ink);font:var(--body)/1.65 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--accent);overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:var(--s2) var(--s4);font-weight:600;transition:transform .15s,opacity .15s}button:hover:not(:disabled){border-color:var(--muted);background:var(--paper)}button:active:not(:disabled){transform:translateY(1px)}.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}.primary:hover:not(:disabled){background:var(--ink);color:var(--panel)}.quiet{background:transparent;border-color:transparent}.danger{color:var(--bad)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:fixed;top:-100px;left:var(--s4);z-index:20;background:var(--panel);padding:var(--s3)}.skip:focus{top:var(--s4)}

num.flagged::after{content:'';position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}.num.right{background:var(--good-bg);border-color:var(--good)}.num.wrong{background:var(--bad-bg);border-color:var(--bad)}.timer{font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:1px}.timer.urgent{color:var(--bad)}.score-block{display:flex;gap:var(--s8);align-items:center;flex-wrap:wrap}.score-value{font:72px/1 Georgia,serif;color:var(--accent)}.score-value span{font:24px/1 Georgia,serif}.domain-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}.domain-row .progress{grid-column:1/-1;margin:0;height:4px}.review-list{display:grid;gap:var(--s4)}.review-list details>summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}.review-list details .feedback{font-weight:400}.history-item{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);flex-wrap:wrap;border-bottom:1px solid var(--line);padding:var(--s6) 0}.history-item h3{margin:0 0 var(--s2)}.history-item:last-child{border:0}.empty{padding:var(--s12);text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:var(--radius);padding:var(--s8);background:var(--panel);color:var(--ink);max-width:min(480px,calc(100% - 32px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(20,30,20,.4)}dialog h2{font-size:var(--h2)}.toast{position:fixed;bottom:var(--s6);left:50%;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:var(--rail);color:var(--panel);padding:var(--s3) var(--s6);border-radius:8px}.footer-note{margin-top:var(--s12);font-size:var(--small);color:var(--muted)}.rowline{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}.full{width:100%}.gap-top{margin-top:var(--s6)}[hidden]{display:none!important}

<body><a href="#app" class="skip">Skip to content</a><div class="layout"><aside class="rail"><div class="wordmark">NORTHSTAR<span>CCDV-F LEARNING</span></div><nav aria-label="Main navigation"><button data-nav="home" aria-current="page">Practice desk</button><button data-nav="history">History</button><button data-nav="learn">Learning plan</button><button data-nav="settings">Progress & info</button></nav><div class="rail-foot"><p><span class="status-dot"></span>Ready for offline study</p><p>557 questions.<br>Practice exams & drills.</p><p class="small">Independent practice<br>November 2026 edition</p></div></aside><div class="main"><header class="topbar"><strong id="page-label">Practice desk</strong><div class="cluster"><span id="timer" class="timer" aria-label="Time remaining" hidden></span><button id="reset-timer" data-action="reset-timer" hidden>Reset timer</button><span id="save-status" class="saved">Saved on this browser</span></div></header><div id="storage-warning" class="notice" role="status" hidden>Browser storage is unavailable. You can still practice, but export a backup before closing this page.</div><main id="app" class="content"></main></div></div><dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message"><h2 id="dialog-title"></h2><p id="dialog-message"></p><form method="dialog"><div class="cluster gap-top"><button id="dialog-cancel" value="cancel">Cancel</button><button id="dialog-confirm" class="primary" value="confirm">Continue</button></div></form></dialog><input id="import-file" type="file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status" hidden></div><noscript><div class="panel">Enable JavaScript in your browser to use these offline tests. The printable PDF/TXT pack is available separately.</div></noscript><script></script><script id="quiz-data" type="application/json">{"questions":[{"id":"C34","domain":"Applications and Integration","question":"Your application needs to process 10,000 independent, non-urgent requests (an overnight classification run) where a turnaround of a few hours is acceptable. What is the most appropriate integration approach?","options":["Send all requests synchronously in a tight loop as fast as possible","Use the Message Batches API to submit the requests as a batch job at a lower cost","Open one long-lived streaming connection for all requests simultaneously","Manually shard the requests across multiple API keys to bypass rate limits"],"answers":[1],"explanation":"The Message Batches API is designed for large volumes of non-latency-sensitive requests and offers reduced cost compared to synchronous calls.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"34"},{"id":"C35","domain":"Applications and Integration","question":"You are translating a product requirement — 'a real-time chat feature' — into a technical integration plan. Which factor should most directly influence your choice between synchronous (real-time) calls and the Batches API?","options":["The programming language used by the frontend, since only some languages can stream","Whether the use case needs an immediate response or can tolerate delay","The number of engineers on the team","Whether the application uses TypeScript or Python, since only one SDK supports the Batches API"],"answers":[1],"explanation":"Latency sensitivity is the key driver: real-time, user-facing interactions need synchronous calls; bulk/delay-tolerant work suits the Batches API.","sources":[],"origin":"Community","sourceId":"35"},{"id":"C36","domain":"Applications and Integration","question":"Roughly what cost reduction does the Message Batches API offer relative to equivalent synchronous requests?","options":["No reduction; batching only changes latency","About 10%","About 50%","About 90%"],"answers":[2],"explanation":"Batch processing is priced at roughly half the cost of the equivalent synchronous calls, which is the main reason to choose it for delay-tolerant volume.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing","https://platform.claude.com/docs/en/about-claude/models/overview"],"origin":"Community","sourceId":"36"},{"id":"C37","domain":"Applications and Integration","question":"You submit a batch and need to match each result back to the row of your database that produced it. What mechanism supports this?","options":["You must submit one request per batch to keep the mapping unambiguous","Results are returned in exactly the submission order, so you can zip them positionally","You re-send the original prompt text and match on string equality","Each request carries a caller-supplied custom identifier that is echoed on its result"],"answers":[3],"explanation":"Each request in a batch carries a caller-assigned identifier that comes back attached to the corresponding result, so results can be reassociated without relying on ordering.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"37"},{"id":"C38","domain":"Applications and Integration","question":"A batch has been submitted but not all requests have finished. What is true of the results?","options":["Nothing is retrievable until every request in the batch reaches a terminal state","The batch is automatically cancelled if any single request fails","Partial results are streamed back continuously as each request completes","Failed requests silently disappear from the result set"],"answers":[0],"explanation":"A batch is retrieved once processing has ended; individual requests reach terminal states and the results become available as a set rather than as a live stream.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"38"},{"id":"C39","domain":"Applications and Integration","question":"Select the TWO scenarios that are appropriate for the Message Batches API.","options":["Generating the reply in a live chat widget while the user waits","Re-classifying a 400,000-row archive of historical support tickets overnight","Generating bulk tags and summaries for a data warehouse refresh that runs nightly","Streaming a token-by-token response into a code editor's autocomplete"],"answers":[1,2],"explanation":"Batch suits high-volume, delay-tolerant work such as re-classifying a historical archive or annotating records for a nightly refresh. A live chat reply and token-by-token autocomplete are latency-critical and interactive, so they need a synchronous or streaming request.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"39"},{"id":"C303","domain":"Applications and Integration","question":"Which statement about Message Batches API timing is accurate?","options":["Batches never expire","A batch unfinished after 24 hours expires; results stay downloadable for 29 days","Results are deleted as soon as they are downloaded once, so they must be saved immediately","Every batch completes in under one minute"],"answers":[1],"explanation":"Batches trade latency for a 50% discount and throughput. Most batches finish within an hour; requests still unfinished at 24 hours come back as 'expired' and are not billed, and results remain downloadable for 29 days.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"303"},{"id":"C304","domain":"Applications and Integration","question":"In a batch result set, some entries have result types errored, canceled or expired. How are those billed?","options":["They are billed at the full synchronous rate","The whole batch is billed whether or not requests succeed","They are not billed; only succeeded requests are charged","They are billed at double the batch rate"],"answers":[2],"explanation":"Only succeeded requests incur charges. Handle each type explicitly, and resubmit errored or expired requests where appropriate, keyed by custom_id.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"304"},{"id":"C305","domain":"Applications and Integration","question":"A batch shares a large system prompt across 50,000 requests. Why might prompt caching hit less often than in synchronous traffic, and what helps?","options":["Caching is impossible inside batches, so the shared prompt is billed in full every time","Batches require a different model","Batches automatically cache every shared prefix for free, so hit rates cannot fall","Batches can outlast the 5-minute cache; the 1-hour TTL keeps prefixes warm"],"answers":[3],"explanation":"The batch discount and cache pricing stack, but requests in a batch may be processed far apart in time. Using the 1-hour TTL on the shared prefix keeps entries alive across that spread.","sources":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"],"origin":"Community","sourceId":"305"},{"id":"C40","domain":"Applications and Integration","question":"What does enabling citations on a document content block allow an application to do?","options":["Compress the document to reduce token usage","Automatically translate the document into another language before Claude answers questions about it","Convert the document into an image for vision processing","Ground claims in the response to precise locations in the source document"],"answers":[3],"explanation":"Citations ground specific claims back to precise source locations, enabling traceable, source-linked answers.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"40"},{"id":"C41","domain":"Applications and Integration","question":"How does the citations feature differ from simply instructing Claude in the prompt to 'cite your sources'?","options":["Prompt-based citation instructions are always more reliable than the citations feature, which only works on short documents","There is no difference; both produce identical guarantees about where each claim came from","It is a structured API feature that ties claims to specific source locations","Citations can only be used with images, never documents"],"answers":[2],"explanation":"Citations is a structured, API-level grounding mechanism tied to the document content block. It anchors claims to specific source locations, rather than relying on the model to mention a source informally in free text, so it is distinct from and more reliable than a prompt instruction to 'cite sources.'","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"41"},{"id":"C42","domain":"Applications and Integration","question":"A compliance tool needs every factual claim in Claude's output to be traceable to an exact location in the source regulatory document. Which feature is most directly suited to this requirement?","options":["The Batches API, which returns results with per-request IDs","Extended thinking, which shows the model's reasoning steps","Citations on the document content block","Prompt caching"],"answers":[2],"explanation":"Citations is purpose-built for grounding claims to exact source locations, matching this compliance requirement directly.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"42"},{"id":"C43","domain":"Applications and Integration","question":"Which application would benefit LEAST from enabling citations?","options":["A compliance-review tool grounding findings in regulatory text","A legal research tool needing to show exactly where in a case file a claim came from","A research assistant summarizing a scientific paper with source-linked claims","A casual creative-writing brainstorming assistant with no source documents involved"],"answers":[3],"explanation":"Citations only add value when there's a source document to ground claims in; a source-free creative brainstorming task has nothing to cite.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"43"},{"id":"C44","domain":"Applications and Integration","question":"What is a reasonable design choice for an application when citations are enabled and Claude's response includes several grounded claims?","options":["Citations cannot be surfaced to end users under any circumstances","Prevent the user from ever seeing which document a claim came from","Surface the citations to users, e.g. as inline links back to the source","Discard the citation information entirely and show plain text only, to keep the interface uncluttered"],"answers":[2],"explanation":"Surfacing citation data to end users (inline references, source links) is the natural way to realize citations' verifiability benefit.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"44"},{"id":"C45","domain":"Applications and Integration","question":"An application enables citations on its document blocks and also requests a JSON response through structured outputs (output_config.format). What happens?","options":["The citations are embedded inside the JSON automatically","Citations are silently dropped and the JSON is returned","Structured outputs is ignored and plain cited text is returned","The request is rejected with a 400, because citations and structured outputs are incompatible"],"answers":[3],"explanation":"Citations interleave cited text blocks with source locations, which conflicts with a schema-constrained response, so the combination returns a 400. Choose one: citations when traceability is the requirement, structured outputs when a program consumes a fixed shape.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"45"},{"id":"C46","domain":"Applications and Integration","question":"A compliance team needs every assertion in a generated summary to be traceable to an exact location in the source filing. Which approach best meets this?","options":["Append 'always cite your sources' to the system prompt and parse the model's freeform references","Enable the citations feature on the document content block and render the returned source locations","Ask for a bibliography at the end of the response","Lower temperature so the model quotes the document more literally"],"answers":[1],"explanation":"Citations is an API-level feature on the document block that returns structured references to precise source locations, which is verifiable in a way that prompt-level instructions are not.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"46"},{"id":"C47","domain":"Applications and Integration","question":"What distinguishes the citations feature from simply instructing the model to cite its sources?","options":["Citations works without providing any source document","It returns structured references tied to the supplied document","Citations is only available in batch mode","Citations replaces the need to validate output entirely, since every claim is guaranteed correct"],"answers":[1],"explanation":"The feature yields structured, machine-readable references anchored to the document you supplied, which is why they can be displayed and checked; prompt-level requests produce prose that may itself be fabricated.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"47"},{"id":"C314","domain":"Applications and Integration","question":"When citations are enabled on a plain-text document, how does the response identify each cited passage?","options":["An HTTP header listing page numbers","Nothing; citations are only visible in the Console, not in the API response","A footnote list appended as free text at the end of the response, numbered in order","Text blocks carry a citations array with the cited text and location"],"answers":[3],"explanation":"Citations are structured and machine-readable: char_location for plain text, page_location for PDFs, content_block_location for custom content. That is what lets an app render verifiable links.","sources":["https://platform.claude.com/docs/en/build-with-claude/citations"],"origin":"Community","sourceId":"314"},{"id":"C277","domain":"Applications and Integration","question":"A team adds a CI test that compares each Claude response to a stored 'golden' string and fails on any difference. What happens over time?","options":["It reliably catches every regression, because any change at all in the output is flagged","It reduces token cost","It fails on correct but reworded answers, creating noise until it's disabled","It makes the model deterministic"],"answers":[2],"explanation":"Outputs vary between identical runs, so literal comparison reports wording changes rather than regressions. Use scored evaluation against a versioned set with a threshold, plus contract tests on schemas and parsers.","sources":[],"origin":"Community","sourceId":"277"},{"id":"C278","domain":"Applications and Integration","question":"Select the TWO pipeline stages that suit a Claude-backed service.","options":["Automatically rewriting the prompt and redeploying whenever an eval score drops","A scored evaluation against a versioned dataset, with a pass threshold","Exact string comparison of every response against a stored output","Contract tests that check output schemas and the downstream parsers that consume them"],"answers":[1,3],"explanation":"A stage earns its place if it catches real regressions and stays green when a correct answer is reworded. Literal comparison fails the second test; automatic remediation deletes the signal a human was meant to act on. A token/cost regression check is a good third stage.","sources":[],"origin":"Community","sourceId":"278"},{"id":"C279","domain":"Applications and Integration","question":"A pull request adding a Claude feature hardcodes the model name and API settings, has no error handling for rate limits, and includes no tests. What should the reviewer do?","options":["Approve it because the feature works in the demo","Request only tests, since they would reveal the other problems","Approve it and fix the gaps in a follow-up commit of their own","Request all three fixes before merge, since each gap fails independently in production"],"answers":[3],"explanation":"Hardcoded configuration needs a deploy to change, a missing error path turns the first rate limit into an unhandled exception, and no tests leave both unverifiable. Fixing only the largest gap is wrong by the same rule as fixing none.","sources":[],"origin":"Community","sourceId":"279"},{"id":"C280","domain":"Applications and Integration","question":"Prompts in a codebase are edited directly in production config, and nobody can say which wording was live last Tuesday. What is the fix?","options":["Treat prompts as code: versioned, with tracked history and code-level review","Keep a hand-maintained change log in a wiki page that records each production edit by date","Freeze all prompt edits permanently","Store prompts only in the model's context window, so the live wording is always visible"],"answers":[0],"explanation":"A prompt is behaviour-defining code; two prompt versions are two different systems on the same input. A manual log matches reality only while somebody maintains it.","sources":[],"origin":"Community","sourceId":"280"},{"id":"C281","domain":"Applications and Integration","question":"An automated code-review bot comments on every pull request. The team assumes risky changes are now blocked. What is wrong with this assumption?","options":["Automated reviews cannot read code","A reviewer only produces findings; a merge gate must be built from them","Bots always block merges on their own whenever a finding is posted, so nothing more is needed","Findings from bots are legally binding"],"answers":[1],"explanation":"A managed review can post inline comments and a check run that never blocks on its own. Treating the reviewer's presence as a gate converts a signal meant for a human into nothing.","sources":[],"origin":"Community","sourceId":"281"},{"id":"C282","domain":"Applications and Integration","question":"Which properties make a change easy to review?","options":["It bundles several unrelated features together, so the reviewer only has to look once","It is as large as possible so the reviewer sees the full context of every related change","It does one thing, with a running example, a test and stated assumptions","It omits tests because the reviewer can run the code"],"answers":[2],"explanation":"A reviewer forced to reconstruct intent reviews last and catches least. Small, single-purpose changes with evidence and stated assumptions get reviewed well.","sources":[],"origin":"Community","sourceId":"282"},{"id":"C283","domain":"Applications and Integration","question":"A scripted Claude Code job produces different results on a developer laptop and the CI runner. What is the most likely cause and fix?","options":["Claude Code randomises output on CI unless a fixed seed is passed on the command line","CI runners use a different model by default, chosen by the runner's region","Laptops have faster internet","They load whatever host config exists; use explicit configuration everywhere"],"answers":[3],"explanation":"Non-interactive runs load whatever hooks, settings, skills and MCP servers the host has configured, and a run that loads whatever the host happens to have is not reproducible. State the context explicitly, for example with a bare mode that skips local discovery, for jobs that must behave identically everywhere.","sources":[],"origin":"Community","sourceId":"283"},{"id":"C294","domain":"Applications and Integration","question":"What does a dateless model ID such as claude-sonnet-4-6 (and later) refer to?","options":["A model that is retrained weekly","One fixed snapshot; an updated model ships under a new ID","Whatever the newest Sonnet happens to be, updated as new snapshots ship","A random model chosen per request"],"answers":[1],"explanation":"From the 4.6 generation the dateless ID is canonical and pinned. Earlier models carried a snapshot date, and their short aliases advanced to the newest snapshot of that minor version.","sources":["https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions","https://platform.claude.com/docs/en/about-claude/models/overview"],"origin":"Community","sourceId":"294"},{"id":"C295","domain":"Applications and Integration","question":"A regression appeared after a week in which the model ID, two prompts and a plugin version all changed, and none of the changes were recorded. What does this situation lack, and what fixes it?","options":["A faster upgrade cadence, so every component always runs its latest release together","More logging of model outputs","Attributability: pin every behaviour-deciding input in tracked configuration","Removing the plugin that most recently changed, since plugins are the usual cause of regressions"],"answers":[2],"explanation":"The span between the last reproducible state and now holds every unrecorded change. Make every behaviour-deciding input (model ID, prompt version, plugin versions, configuration) explicit and pinned in tracked configuration: pinning creates the record, rollback is what it buys, and an upgrade cadence records nothing.","sources":[],"origin":"Community","sourceId":"295"},{"id":"C296","domain":"Applications and Integration","question":"A team pins an exact model ID. Can observable behaviour still change?","options":["No; a pinned ID guarantees byte-identical outputs forever","Only if the team changes the prompt, temperature or other request parameters","Only if the API key is rotated","Yes; weights are fixed, but serving logic and classifiers can change"],"answers":[3],"explanation":"Weights are fixed per ID, but routing, safety classifiers and serving logic can change, so pinning bounds the variables rather than removing them. Pinning holds the model steady, not the whole serving stack. That is another reason to keep an evaluation baseline running against production.","sources":["https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions"],"origin":"Community","sourceId":"296"},{"id":"C297","domain":"Applications and Integration","question":"Why keep the previously pinned model ID available in configuration after upgrading?","options":["To roll back to a known-good value if a regression appears","Because the API requires two model IDs per request, a primary and a fallback","To halve token costs","Because old IDs never retire, so they remain a free fallback forever"],"answers":[0],"explanation":"Half the value of pinning is having a rollback target, and it is the half most often skipped.","sources":[],"origin":"Community","sourceId":"297"},{"id":"C298","domain":"Applications and Integration","question":"Each environment (dev, staging, prod) runs a different model, prompt version and plugin set, and nobody can say why. What is the right fix?","options":["Unpin everything so the environments converge on latest","Consolidate into tracked configuration that declares each environment's deliberate differences","Hardcode configuration into application code","Make all environments identical at all times"],"answers":[1],"explanation":"Environments differ on purpose; the fix is to declare the differences where they can be read back. Configuration in application code forces a release for every settings change.","sources":[],"origin":"Community","sourceId":"298"},{"id":"C299","domain":"Applications and Integration","question":"A Claude Code plugin your team depends on changed behaviour overnight, though nothing in your repository changed. What prevents a repeat?","options":["Disable all plugins","Fork and copy the plugin into every repository, then patch each copy by hand","Declare a version constraint so it resolves within a tested range","Read the plugin's release notes every morning"],"answers":[2],"explanation":"An unpinned dependency tracks latest, so an upstream tag changes your behaviour with no commit and no record. A version constraint holds it in a tested range.","sources":["https://code.claude.com/docs/en/plugin-dependencies"],"origin":"Community","sourceId":"299"},{"id":"C300","domain":"Applications and Integration","question":"A feature has been edited in place for months and its evaluation set predates current traffic. The team wants to improve it. What comes first?","options":["Delete the stale evaluation set","Rewrite the prompts from scratch using current best practices and the newest model","Upgrade to the newest model immediately","Restore measurability: pin inputs, version prompts, rebuild the eval set"],"answers":[3],"explanation":"Improvement without a baseline cannot be judged. Pin the inputs, version the prompts as they stand, and rebuild the evaluation set from recent traffic. Rewriting discards what the feature has learned, and deleting the stale set leaves less than nothing.","sources":[],"origin":"Community","sourceId":"300"},{"id":"C301","domain":"Applications and Integration","question":"A prompt is shared by four downstream applications. A change is proposed. What must happen before rollout?","options":["Assess the change's effect on each consumer, then coordinate the rollout","Ship it to two consumers now and the rest later, watching for complaints in between","Announce the change in a channel and ship it","Ship it to staging; a clean staging run counts as the assessment for every consumer"],"answers":[0],"explanation":"Announcing, scheduling and staging are communication, not assessment. Shipping to some consumers leaves one system answering under two versions.","sources":[],"origin":"Community","sourceId":"301"},{"id":"C302","domain":"Applications and Integration","question":"Select the TWO items that belong in version control for a Claude-backed service.","options":["Prompt text, model identifiers and output schemas","Evaluation datasets and their pass thresholds","API keys and other credentials","Each developer's machine-specific local settings"],"answers":[0,1],"explanation":"Anything whose change changes production behaviour belongs in version control. Credentials never do, and machine-specific settings are deliberately excluded.","sources":[],"origin":"Community","sourceId":"302"},{"id":"C48","domain":"Applications and Integration","question":"Who is responsible for maintaining conversation history (prior turns) across multiple calls to the Messages API?","options":["History can only be maintained using the Batches API","History is never needed since Claude has persistent memory across all API calls by default","The calling application, which must include the full relevant message history in each request","Anthropic's servers automatically persist and inject full history for you"],"answers":[2],"explanation":"The Claude API is stateless between calls; the application must resend the conversation history it wants considered on each request.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"48"},{"id":"C49","domain":"Applications and Integration","question":"The Messages API is stateless. What follows for a multi-turn chat application?","options":["The application must resend the relevant prior turns with each new request","The API retains the last ten turns per API key automatically","State is preserved as long as the same model is used","Conversation history is stored server-side and referenced by conversation id"],"answers":[0],"explanation":"Because the endpoint holds no session state, the caller owns the history and must include the prior turns it wants the model to condition on.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"49"},{"id":"C50","domain":"Applications and Integration","question":"A long-running assistant thread is approaching the model's context limit. Which strategy preserves continuity most economically?","options":["Drop the system prompt to free room for more conversation","Truncate the most recent turns, since older context is more authoritative","Start a fresh conversation with no carryover on every request","Summarize older turns into a compact recap and keep recent turns verbatim"],"answers":[3],"explanation":"Compacting distant history into a summary while retaining recent turns verbatim keeps the salient state within budget. Dropping the system prompt or the newest turns discards the most load-bearing context.","sources":[],"origin":"Community","sourceId":"50"},{"id":"C51","domain":"Applications and Integration","question":"In a tool-using conversation, what must the application include when continuing after the model requests a tool call?","options":["A fresh conversation seeded with just the tool output","The tool result with a newly generated identifier of the caller's choosing","Only the tool's output, with the assistant turn omitted","The assistant turn containing the tool request, followed by a user turn carrying the matching tool result"],"answers":[3],"explanation":"The assistant's tool-request turn stays in the history and is answered by a result block whose identifier matches the request, so the model can tie the output to the call it made.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide.md"],"origin":"Community","sourceId":"51"},{"id":"C52","domain":"Applications and Integration","question":"A team ports an older integration that ended every request with a partially written assistant turn (a prefill such as '{') to force JSON. What happens on Claude 4.6 and later models?","options":["The prefill is silently ignored and the response is unaffected","The request is rejected with a 400 invalid_request_error","The model repeats the prefill verbatim and then stops","The prefill resets the system prompt"],"answers":[1],"explanation":"Prefilling the final assistant turn is not supported on Claude 4.6 and later models; the API returns a 400 telling you the conversation must end with a user message. Use structured outputs (output_config.format) to guarantee a JSON shape, or state the format in the system prompt.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide"],"origin":"Community","sourceId":"52"},{"id":"C53","domain":"Applications and Integration","question":"Two users of a chat product occasionally see fragments of each other's conversations. Which application-side defect best explains this?","options":["Conversation history is being kept in a process-wide structure rather than scoped per session","The model's context window is too small for concurrent use","The API is leaking state between requests sharing an API key","Streaming was enabled for both sessions simultaneously"],"answers":[0],"explanation":"Since the API holds no state, cross-talk originates in the application's own history storage — typically history held in shared or global scope instead of per-session.","sources":[],"origin":"Community","sourceId":"53"},{"id":"C62","domain":"Applications and Integration","question":"When extended thinking is enabled for a request, which statement is accurate?","options":["Extended thinking replaces the need for a system prompt","Thinking is free, because the reasoning tokens are never shown to the user and so are never billed","The model reasons first; thinking tokens bill as output and count toward max_tokens","Extended thinking eliminates all token costs for the response, since reasoning replaces the answer"],"answers":[2],"explanation":"Thinking happens before the final answer and is billed as output tokens whether or not the reasoning text is displayed. Display settings (such as an omitted or summarized thinking view) change visibility, not cost.","sources":["https://platform.claude.com/docs/en/build-with-claude/extended-thinking"],"origin":"Community","sourceId":"62"},{"id":"C63","domain":"Applications and Integration","question":"On current Claude models (Claude 4.6 and later), how is the depth of thinking on a request primarily controlled?","options":["It cannot be influenced; the model decides unilaterally","Adaptive thinking together with the effort parameter","By selecting a dedicated reasoning-only endpoint that runs a separate thinking model","By raising temperature until reasoning appears"],"answers":[1],"explanation":"Adaptive thinking lets the model decide how much to think, and output_config.effort (low, medium, high and above) sets how much it spends, trading thoroughness against token spend. The older fixed budget_tokens setting is deprecated on the 4.6 models and rejected with a 400 on newer ones, so effort is the dial to reach for. Temperature is unrelated, and non-default sampling values are themselves rejected on Claude 4.7 and later.","sources":["https://platform.claude.com/docs/en/build-with-claude/extended-thinking","https://platform.claude.com/docs/en/build-with-claude/effort"],"origin":"Community","sourceId":"63"},{"id":"C64","domain":"Applications and Integration","question":"A team runs every request in a high-volume classification pipeline at the highest effort level, and costs rise sharply with no accuracy gain. What is the most reasonable conclusion?","options":["High effort is incompatible with classification and returns invalid labels that are then retried at full cost","Effort should be raised further to see a benefit","The cost increase is unrelated to effort and must come from prompt caching writes on every request","Simple pattern-matching rarely benefits from extra thinking, so effort should be tuned down"],"answers":[3],"explanation":"Reasoning tokens are billed like other output, so maximum effort on a task that does not need deliberation adds cost without quality benefit. Effort is tuned per route against an eval: classification and chat often do well at low effort, while coding and long agentic work repay higher settings.","sources":["https://platform.claude.com/docs/en/build-with-claude/effort"],"origin":"Community","sourceId":"64"},{"id":"C65","domain":"Applications and Integration","question":"Which task profile is the strongest candidate for extended thinking?","options":["Extracting a phone number from a fixed-format record","Reconciling a multi-step financial calculation with interacting constraints","Translating a single sentence into French","Echoing a supplied string in uppercase"],"answers":[1],"explanation":"Deliberation pays off where the answer depends on several interacting steps that benefit from working through. Mechanical single-step transformations gain nothing.","sources":[],"origin":"Community","sourceId":"65"},{"id":"C66","domain":"Applications and Integration","question":"When continuing a tool-use conversation in which extended thinking was enabled, how should the prior thinking content be handled?","options":["Rewrite the thinking blocks into a shorter paraphrase","Strip all thinking blocks before sending the next request","Preserve the returned thinking blocks in the conversation history as they were received","Move the thinking content into the system prompt"],"answers":[2],"explanation":"Thinking blocks are returned as part of the assistant turn and are passed back unmodified when continuing the exchange, so the model retains the reasoning that led to its tool request.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide.md"],"origin":"Community","sourceId":"66"},{"id":"C67","domain":"Applications and Integration","question":"Where does extended thinking output appear in a response?","options":["In an HTTP header","Interleaved silently into the text block with no marker","Only in the usage object as a token count","As a distinct content block preceding the final text"],"answers":[3],"explanation":"Reasoning is returned as its own content block ahead of the answer, which is what lets an application choose whether to display, log, or hide it.","sources":["https://platform.claude.com/docs/en/models/opus-5-5/migration-guide.md","https://platform.claude.com/docs/en/build-with-claude/extended-thinking"],"origin":"Community","sourceId":"67"},{"id":"C284","domain":"Applications and Integration","question":"A research assistant fetches web pages and passes them to Claude. Where should the fetched content go?","options":["In tool_result blocks, labelled and delimited, never overriding system instructions","Into a tool_result block together with the developer's standing instructions, so both are read together","Appended to the developer's own instructions in the same text block","Concatenated into the system prompt so the model definitely reads it and treats it as policy"],"answers":[0],"explanation":"Authority follows the channel. Persistent rules go in the system prompt, the user's own request in the user turn, and third-party content in tool results. Your own instructions never belong in a tool result, because content there is treated as untrusted.","sources":[],"origin":"Community","sourceId":"284"},{"id":"C285","domain":"Applications and Integration","question":"An operator needs to switch a running conversation into 'terse mode' without invalidating the cached prefix. On models that support it, what is the cleanest mechanism?","options":["Put the instruction inside the most recent tool_result","A mid-conversation system message appended to the messages array","Ask the user to type the instruction themselves","Edit the top-level system prompt on the next request; the cache adapts automatically"],"answers":[1],"explanation":"A mid-conversation system message carries operator authority, cannot be the first message, and appends after the cached history, so the prefix stays intact. Editing top-level system invalidates the cache from that point on.","sources":["https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages","https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"285"},{"id":"C286","domain":"Applications and Integration","question":"The same guidance behaves well in Claude Code's terminal but poorly when the team calls the Messages API directly. Why?","options":["The API uses a weaker model","The terminal runs at a higher temperature, which makes the model follow guidance more closely","The API is stateless; Claude Code adds its own system prompt and project context","The API ignores system prompts unless they are repeated inside every user message as well"],"answers":[2],"explanation":"The raw API sees only what you send. The Agent SDK defaults to a minimal prompt, and Claude Code adds full working context. A rule the application depends on must be stated once per channel it relies on.","sources":["https://code.claude.com/docs/en/memory"],"origin":"Community","sourceId":"286"},{"id":"C287","domain":"Applications and Integration","question":"A pipeline extracts facts from a contract and then writes a customer-facing summary, all in one call with one output schema. Quality is uneven between the two parts. What should change?","options":["Raise the token limit on the combined call","Lower the temperature","Add 'be thorough' to the prompt","Split them into separate calls"],"answers":[3],"explanation":"Stages judged by different standards of success need separate calls, each with its own output contract and its own evaluation. The token-cost argument for merging them leaves quality out of the comparison.","sources":[],"origin":"Community","sourceId":"287"},{"id":"C288","domain":"Applications and Integration","question":"A downstream service keeps breaking on JSON that is well formed and schema-valid. What is the most likely design mistake?","options":["The schema fits the producer's idea of a good answer, not the consumer's needs","The consumer should loosen its parser until it passes, accepting any extra or missing fields","The JSON is too short","The model should return XML instead"],"answers":[0],"explanation":"A schema is a contract with the model, the consumer and the platform. Write it from what the consumer needs rather than what a good answer looks like, and version it on the consumer's schedule rather than the producer's.","sources":[],"origin":"Community","sourceId":"288"},{"id":"C289","domain":"Applications and Integration","question":"Why is project guidance in CLAUDE.md or similar instruction files not enough to guarantee an action never happens?","options":["Instruction files are encrypted and unreadable by the model once the session starts","They only shape decisions; a hook or permission rule actually blocks it","Instruction files are only read in plan mode, so normal sessions never load the guidance","Instruction files are ignored entirely"],"answers":[1],"explanation":"Instruction files load as context that shapes decisions. Context shifts probability; a gate decides. Only a deterministic check that runs first, such as a hook or a permission rule, removes the option. Whenever a requirement contains the word 'never', ask which component would have to fail for the outcome to occur.","sources":["https://code.claude.com/docs/en/memory"],"origin":"Community","sourceId":"289"},{"id":"C71","domain":"Applications and Integration","question":"Which statement about sending base64-encoded images to Claude via the Messages API is accurate?","options":["Base64-encoded images cannot be included in a Messages API request under any circumstances","Base64-encoded images require a completely separate, non-Messages API endpoint","Base64-encoded images can only be sent using the deprecated Completions API","Base64-encoded images can be included as typed image content blocks within a message, alongside text"],"answers":[3],"explanation":"An image block's source can be inline base64 data (with a media type), a URL, or a file_id from the Files API. It sits in the message content alongside text blocks.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"71"},{"id":"C72","domain":"Applications and Integration","question":"Which statement about sending PDF documents to Claude via the Messages API is accurate?","options":["PDF documents can be included as typed document content blocks within a message, alongside text","PDF documents require a completely separate, non-Messages API endpoint","PDF documents can only be sent using the deprecated Completions API","PDF documents cannot be included in a Messages API request under any circumstances"],"answers":[0],"explanation":"PDFs are sent as document content blocks (base64, URL, or Files API file_id). Each page is processed both as extracted text and as an image, so page count drives token cost.","sources":["https://platform.claude.com/docs/en/build-with-claude/pdf-support.md"],"origin":"Community","sourceId":"72"},{"id":"C73","domain":"Applications and Integration","question":"A support app re-sends the same 40-page PDF manual on every turn of a long conversation. Which approach avoids re-uploading the bytes each time?","options":["Paste the manual into the system prompt as plain text on every request","Convert the PDF to images and send those instead","Upload it once with the Files API and reference it by file_id in a document block (and cache the prefix if it is resent often)","Send the manual only on the first turn; the API remembers it for the session"],"answers":[2],"explanation":"The Files API lets you upload once and reference the file by file_id in later requests. The API is still stateless, so the reference must appear in every request that needs it, and prompt caching is what stops you paying full input price for the repeated tokens.","sources":["https://platform.claude.com/docs/en/build-with-claude/pdf-support.md","https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"73"},{"id":"C74","domain":"Applications and Integration","question":"A developer wants Claude to analyze a screenshot of a UI bug. What is the correct way to include this in a Messages API request?","options":["As an image content block (e.g. base64-encoded) within the same message alongside any accompanying text","As a separate, unrelated API call using a different endpoint entirely","By embedding a URL directly in the system prompt text with no special formatting","Images cannot be analyzed by Claude under any API configuration"],"answers":[0],"explanation":"Vision input is provided as typed image content blocks within a message, which can be combined with text blocks in the same request.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"74"},{"id":"C75","domain":"Applications and Integration","question":"An invoice-processing service receives scanned PDFs and must extract line items. What is the most direct integration?","options":["Send the PDF as a document content block in the same Messages request as the extraction instruction","Run a separate OCR service first, since the API accepts text only","Convert the PDF to a spreadsheet before sending it","Call a dedicated document endpoint distinct from Messages"],"answers":[0],"explanation":"PDFs are supplied as document content blocks alongside the text instruction in an ordinary Messages request; there is no separate document endpoint.","sources":["https://platform.claude.com/docs/en/build-with-claude/pdf-support.md"],"origin":"Community","sourceId":"75"},{"id":"C76","domain":"Applications and Integration","question":"Select the TWO accurate statements about multimodal requests.","options":["Multiple images can be included in a single message alongside text","Images must be sent to a separate vision endpoint before the text request","Only one content block of any type is permitted per message","Image content blocks may be supplied as base64-encoded data"],"answers":[0,3],"explanation":"Messages accept several content blocks of mixed types, and images can be provided as base64 data. There is no separate vision endpoint, and messages are not limited to a single block.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md"],"origin":"Community","sourceId":"76"},{"id":"C77","domain":"Applications and Integration","question":"Image-heavy requests in a document pipeline are consuming far more tokens than expected. Which factor most directly explains this?","options":["Image dimensions drive token consumption, so large images cost substantially more than downscaled ones","Base64 encoding is billed at double the rate of binary upload","Only the file name is tokenized, so cost should be negligible","Images are billed per request rather than per token, so volume is irrelevant"],"answers":[0],"explanation":"Claude reads images in 28x28-pixel patches, so an image costs about ceil(width/28) x ceil(height/28) visual tokens, up to the model's resolution cap (images above it are downscaled first, which caps the cost). Below that cap, larger images cost more, so downscaling to the smallest size that keeps the detail you need is the main lever on cost. Encoding method and file name do not change the token count.","sources":["https://platform.claude.com/docs/en/build-with-claude/vision.md","https://platform.claude.com/docs/en/build-with-claude/vision"],"origin":"Community","sourceId":"77"},{"id":"C313","domain":"Applications and Integration","question":"A 300-page scanned PDF costs far more tokens than its file size suggests. Why?","options":["PDFs are billed per megabyte","Only the first page is billed","Each page is processed as text and as an image, so pages drive cost","Scanned PDFs are billed at double the output rate because OCR runs server-side"],"answers":[2],"explanation":"Because pages are rendered as well as read, a long document is expensive regardless of compression. Send only the pages the task needs.","sources":["https://platform.claude.com/docs/en/build-with-claude/pdf-support"],"origin":"Community","sourceId":"313"},{"id":"C78","domain":"Applications and Integration","question":"You are building a customer support widget that must handle a static 5,000-token system prompt on every request while user input varies. What should you do to reduce latency and cost?","options":["Send the system prompt as a separate API call before each user turn","Enable prompt caching on the static system prompt content","Truncate the system prompt to 500 tokens","Switch to synchronous polling instead of a single request"],"answers":[1],"explanation":"Prompt caching lets repeated static content (like a large system prompt) be reused across calls without being reprocessed and re-billed at full price each time.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"78"},{"id":"C79","domain":"Applications and Integration","question":"How do the costs of a cache write and a cache read compare to an ordinary uncached input token?","options":["A write costs somewhat more than an uncached token; a read costs a small fraction of one","A write is free and a read is billed at the full rate","Both cost the same as an uncached token; only latency improves","Both are cheaper than an uncached token"],"answers":[0],"explanation":"Establishing the cache carries a premium over normal input pricing, while subsequent reads of that prefix are billed at a small fraction, which is why caching only pays off when the prefix is reused.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"79"},{"id":"C80","domain":"Applications and Integration","question":"Caching was enabled on a large system prompt, but the hit rate is near zero. The prompt ends with the current timestamp. What is the problem?","options":["The timestamp changes the cached prefix on every call, so no request matches a stored one","Caching cannot be applied to system prompts","Timestamps are stripped automatically, so the cause must lie elsewhere","The cache requires the whole request, not just a prefix, to be identical"],"answers":[0],"explanation":"A cache hit needs an exact prefix match. Volatile content inside the cached span invalidates it every call; such content belongs after the cache breakpoint.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"80"},{"id":"C81","domain":"Applications and Integration","question":"Where should a cache breakpoint be placed in a request containing tool definitions, a long static system prompt, and a short variable user question?","options":["Between the tool definitions and the system prompt only","After the tool definitions and system prompt, before the user question","After the user question, at the end of the request","At the very start of the request, before the tool definitions"],"answers":[1],"explanation":"The breakpoint goes at the end of the stable span so tools and the static system prompt are cached while the varying question stays outside the cached prefix.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"81"},{"id":"C82","domain":"Applications and Integration","question":"How can an application confirm that prompt caching is actually taking effect?","options":["By enabling streaming, which emits a cache-hit event","Caching is opaque and cannot be observed from the response","By comparing wall-clock latency across runs, the only available signal","By reading cache creation and cache read token counts reported in the response usage data"],"answers":[3],"explanation":"Usage data reports tokens written to and read from the cache, which is the direct measurement of whether the breakpoint is working.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"82"},{"id":"C83","domain":"Applications and Integration","question":"A cached prefix stops being reused after a quiet period in a low-traffic application. What explains this?","options":["Low traffic increases the minimum cacheable length","Cache entries expire after a period of inactivity","Caches persist indefinitely, so the cause must be a prompt change","Caches are invalidated whenever the API key is used from a new IP"],"answers":[1],"explanation":"Cache entries have a limited lifetime that refreshes on use, so sparse traffic can let an entry lapse between requests.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"83"},{"id":"C84","domain":"Applications and Integration","question":"Select the TWO conditions under which prompt caching delivers meaningful savings.","options":["Each request contains entirely new text with no shared prefix","A large reference document is resent unchanged across many requests","A lengthy static system prompt precedes a short varying user message on every call","Requests are large but each is issued exactly once"],"answers":[1,2],"explanation":"Savings require a substantial prefix that repeats across calls. Content that is unique per request, or large but never reused, cannot produce cache reads.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"84"},{"id":"C306","domain":"Applications and Integration","question":"In what order is a request's cacheable prefix built, and why does it matter?","options":["tools, then system, then messages; a change at one level invalidates the cache for everything after it","There is no order; any change invalidates only that block","messages, then system, then tools; only message changes matter","Alphabetical by field name"],"answers":[0],"explanation":"Caching is an exact prefix match. Keep stable content first (frozen tool list, static system prompt) and volatile content after the last cache breakpoint.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"306"},{"id":"C307","domain":"Applications and Integration","question":"A team toggles thinking or effort settings on some requests that share a large cached prefix, and cache reads fall. What is happening?","options":["The cache TTL is reset to zero by streaming","Changing thinking or effort settings invalidates the cached messages","Thinking tokens are cached separately and always hit, so the drop must come from somewhere else","Effort only affects output length, so caching cannot change; the drop must be random"],"answers":[1],"explanation":"Settings that change how the model processes the request are part of what a cache entry depends on. Decide thinking/effort per route rather than flipping it per request against a shared prefix.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"307"},{"id":"C308","domain":"Applications and Integration","question":"Select the TWO accurate statements about prompt caching limits.","options":["A request can have at most four cache breakpoints","Cache entries live forever once written","A prefix shorter than the model's minimum cacheable length silently does not cache, with no error","Cache reads cost the same as uncached input"],"answers":[0,2],"explanation":"Up to four breakpoints per request. Minimum cacheable length is model-dependent (roughly 512 to 4,096 tokens), and falling short is silent: the cache usage counters stay at zero. Reads cost about a tenth of base input on most models.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"308"},{"id":"C309","domain":"Applications and Integration","question":"Traffic sharing a large prefix arrives in bursts roughly every 20 minutes. Which cache TTL fits, and what does it cost?","options":["The 5-minute TTL, since it refreshes itself every few minutes even without traffic","The 1-hour TTL, which is free to write","The 1-hour TTL (writes about 2x base input), since 5 minutes would lapse","No caching, since the prefix is shared"],"answers":[2],"explanation":"A cache read refreshes the entry's timer at no extra cost. If requests sharing a prefix start less than 5 minutes apart, the default stays warm; longer gaps call for the 1-hour TTL (2x write) or a keep-alive request.","sources":["https://platform.claude.com/docs/en/build-with-claude/prompt-caching"],"origin":"Community","sourceId":"309"},{"id":"C250","domain":"Applications and Integration","question":"A product manager asks for 'an AI assistant that answers questions about customer accounts'. The platform serves many tenant companies and keeps an audit log for regulators. What should happen before choosing an architecture?","options":["Copy the retrieval design from a neighbouring single-tenant product, since the domain is the same","Elicit unstated constraints: tenant isolation, auditing, residency, failure modes","Build a quick prototype first and fix any tenancy issues as users report them in production","Ship behind a feature flag and monitor for problems"],"answers":[1],"explanation":"Standing constraints such as multiple tenants and audit obligations predate the request and appear in no description of it. Iteration needs a signal, and a tenancy or authorization defect emits none until it becomes an incident, so these must be elicited before building.","sources":[],"origin":"Community","sourceId":"250"},{"id":"C251","domain":"Applications and Integration","question":"Which of these is a testable functional requirement?","options":["'The assistant should use the best available model for every customer request.'","'The assistant should be fast and accurate when answering order and refund questions.'","'If the caller doesn't own the order ID, return not-found and no order details.'","'Responses should feel seamless to users.'"],"answers":[2],"explanation":"A functional requirement names an observable behaviour someone can mark pass or fail. 'Fast', 'accurate' and 'seamless' are goals until converted into a check; naming a model is a design choice, not a requirement.","sources":[],"origin":"Community","sourceId":"251"},{"id":"C252","domain":"Applications and Integration","question":"A team must choose between a hosted agent runtime and self-hosting. A contract states that customer data may only be processed in the EU. How should this constraint be used in the decision?","options":["As a concern to revisit after launch","As one heavily weighted factor in a scoring matrix alongside cost, latency and familiarity","As something the model provider handles automatically for any customer with an EU billing address","As a filter: options that cannot satisfy it are eliminated before anything is compared"],"answers":[3],"explanation":"Regulations, jurisdictions and retention obligations decide which options are admissible. Speed, cost and familiarity only order what survives the rule; they never overturn it.","sources":[],"origin":"Community","sourceId":"252"},{"id":"C253","domain":"Applications and Integration","question":"Functional behaviour for a new Claude feature is fully specified and a platform decision is due. Which additional facts must be obtained before deciding?","options":["Infrastructure needs: latency, peak volume, data location, credentials and audit","Which platform the previous project used, so the team can reuse its setup","The team's favourite programming language","The public benchmark ranking of each candidate model on reasoning and coding leaderboards"],"answers":[0],"explanation":"Infrastructure requirements bound the deployment rather than the behaviour: latency measured at the user, peak volume, where data may be processed and stored, and whose credentials act with what audit record. They are obtained by asking the people who hold them, because each is obvious to its owner and invisible in the functional spec.","sources":[],"origin":"Community","sourceId":"253"},{"id":"C254","domain":"Applications and Integration","question":"A teammate proposes reusing another team's authorization approach because 'their system looks just like ours'. What is the right response?","options":["Reuse it and add monitoring to catch differences","Check which of its assumptions (tenancy, roles, data ownership) hold here","Reuse it, since a similar shape implies similar requirements and saves review time","Reject reuse on principle"],"answers":[1],"explanation":"Copying an approach imports its assumptions along with its structure, and an authorization path is where an imported assumption does the most damage.","sources":[],"origin":"Community","sourceId":"254"},{"id":"C255","domain":"Applications and Integration","question":"A service has a strict 300 ms latency budget. What does that tell you about which tenant may see which records?","options":["That only the fastest model may be used","That authorization can be skipped for cached responses","Nothing; latency targets imply no authorization rule","That caching across tenants is permitted to meet the budget"],"answers":[2],"explanation":"Inferring a correctness rule from a performance target is guessing. Latency and data-access rules are separate requirements with separate owners, so which tenant may see which records must be elicited separately.","sources":[],"origin":"Community","sourceId":"255"},{"id":"C256","domain":"Applications and Integration","question":"Why record the source of each constraint (a regulation, a contract clause, a security review) alongside an architecture decision?","options":["It makes the system run faster, because the model can skip re-deriving each constraint at runtime","It removes the need for tests","It is required so the model can read the decision record when it later generates code from it","So reviewers see the design follows from named constraints and notice when one changes"],"answers":[3],"explanation":"A decision record holds the behaviours, the constraints and where each came from. Without sources, a defensible design looks arbitrary to anyone outside the team and cannot be revisited safely.","sources":[],"origin":"Community","sourceId":"256"},{"id":"C257","domain":"Applications and Integration","question":"When is iterating quickly toward a fix (prototype, ship, observe) an appropriate way to discover requirements?","options":["When the change is reversible and failures are loud, cheap and contained","Always, since production traffic is the best teacher","When the system handles multiple tenants' private data","When an audit trail is legally required"],"answers":[0],"explanation":"Monitoring and canaries find constraints by violating them. That is a fair trade when failure is cheap and visible, and a bad one when failure is silent, rare and consequential.","sources":[],"origin":"Community","sourceId":"257"},{"id":"C258","domain":"Applications and Integration","question":"Select the TWO statements about inference location and data residency that are accurate for the Claude API.","options":["Where inference runs and where data is stored are separate settings","Inference location can only be set once per organisation and never per request","Residency is always satisfied automatically by choosing a nearby region in the SDK","A residency requirement that arrives late can force a rebuild, because some placement decisions are fixed when a workspace is created"],"answers":[0,3],"explanation":"Geography is two settings: a per-request inference control (inference_geo, with a workspace default) and a data storage location fixed at workspace creation. Discovering the requirement after launch can therefore cost a migration rather than a config change.","sources":["https://platform.claude.com/docs/en/build-with-claude/data-residency","https://platform.claude.com/docs/en/manage-claude/data-residency"],"origin":"Community","sourceId":"258"},{"id":"C290","domain":"Applications and Integration","question":"A multi-user chat backend 'continues the most recent session' when a request arrives. Users occasionally see another conversation's context. What is wrong?","options":["The API stores sessions per API key","The model is leaking memory between users","Recency isn't identity; select the session by an explicit per-user identifier","Sessions must be continued by timestamp instead, which is unique for each user's conversation"],"answers":[2],"explanation":"Continue resolves by recency, resume resolves by identifier, and fork copies a history into a new identifier. Only an identifier lets identity select the session.","sources":["https://code.claude.com/docs/en/agent-sdk/sessions"],"origin":"Community","sourceId":"290"},{"id":"C291","domain":"Applications and Integration","question":"Agent sessions are resumed on a different worker machine from the one that created them, and resumption fails. Why?","options":["Resumption requires the same IP address as the original session, which the new worker doesn't have","The model forgets sessions after an hour, and moving between workers usually takes longer than that","Sessions can never be resumed","Transcripts are stored locally on the creating machine unless mirrored to shared storage"],"answers":[3],"explanation":"Session files live on the machine that created them, so a different worker cannot find them. To resume across hosts, attach a session store adapter that mirrors transcripts to shared storage (and resume from a matching working directory), copy the session's .jsonl file to the new host, or skip resume and pass the needed state into a fresh session.","sources":["https://code.claude.com/docs/en/agent-sdk/sessions"],"origin":"Community","sourceId":"291"},{"id":"C292","domain":"Applications and Integration","question":"Select the TWO statements about starting a fresh conversation that are accurate.","options":["Ending a session immediately deletes its stored transcript","An idle timeout covers every case where stale context should be dropped","A timeout alone is insufficient; defined events (logout, task completion, role change) and the application's own judgement of new intent are also needed","A rule that depends on the user choosing to start a new chat is not a guarantee"],"answers":[2,3],"explanation":"The clock, events and intent each close a different door into a new conversation. Ending a session stops traffic but does not delete stored transcripts; retention follows its documented or configured period.","sources":["https://code.claude.com/docs/en/sessions"],"origin":"Community","sourceId":"292"},{"id":"C293","domain":"Applications and Integration","question":"A session is resumed after a crash. Which of these does NOT come back automatically?","options":["Launch-time settings such as an elevated permission mode","The conversation history","The record of earlier tool calls in the transcript","The model the session used, which reverts to the account default"],"answers":[0],"explanation":"Resuming restores conversation history, but not every launch-time setting. Flags such as --mcp-config, --settings and --add-dir may need to be supplied again. Permission restoration depends on the resume path: current terminal documentation generally restores plan mode, with path-specific exceptions. Do not assume plan and bypassPermissions share the same restoration rule. Editorial correction, 3 November 2026.","sources":["https://code.claude.com/docs/en/sessions"],"origin":"Community","sourceId":"293"},{"id":"C465","domain":"Applications and Integration","question":"What does forking a session do?","options":["Merges two sessions into one","Deletes the original session","Resumes whichever session was used most recently, under its existing identifier","Copies a history into a new session ID, leaving the original intact"],"answers":[3],"explanation":"Continue picks by recency, resume by identifier, and fork branches a copy under a new identifier.","sources":["https://code.claude.com/docs/en/agent-sdk/sessions","https://code.claude.com/docs/en/sessions"],"origin":"Community","sourceId":"465"},{"id":"C267","domain":"Applications and Integration","question":"A job sends 10,000 classification calls by launching them all at once. It hits rate-limit errors, and many calls exhaust their retries. What is the best fix?","options":["Run every call strictly sequentially in one loop, waiting for each before sending the next","A bounded pool of concurrent workers, or the Batches API if nobody waits","Use several API keys to spread the load","Launch the calls with no delay but add more retries per call, so each one eventually gets through"],"answers":[1],"explanation":"Unbounded fan-out meets the rate limit as a wall and burns retry budget the queued work needs. Bounded concurrency turns a burst into a rate; volume with no waiting caller is the cue for asynchronous batch submission.","sources":[],"origin":"Community","sourceId":"267"},{"id":"C268","domain":"Applications and Integration","question":"After a timeout, a client retried a 'create invoice' call and two invoices were created. What design change prevents this?","options":["Increase the timeout so retries happen less often","Add exponential backoff with jitter to the retry so the server has time to finish","Make the operation idempotent with a unique key per unit of work","Stop retrying any request"],"answers":[2],"explanation":"Retriability is about the cause; safety is about what already happened. Backoff and timeouts change when a repeat happens, not whether it double-writes. An idempotency key makes the unit of work safe to repeat.","sources":[],"origin":"Community","sourceId":"268"},{"id":"C269","domain":"Applications and Integration","question":"A concurrent pipeline sends requests and writes each result back to the record at the same list index. Some results land on the wrong record, with no errors. Why?","options":["The API reorders requests deliberately to save cost, and returns them sorted by input length instead","List indexes are not thread-safe in any language","Results are only out of order when streaming is enabled, which reorders chunks across requests","Results complete out of order; join them on a correlation key, not position"],"answers":[3],"explanation":"Once work overlaps, results arrive with no positional relationship to the request. Joining on position updates the wrong record and raises no error. The same rule applies to batch results and custom_id.","sources":[],"origin":"Community","sourceId":"269"},{"id":"C270","domain":"Applications and Integration","question":"Code handling Claude API errors uses an exhaustive switch over every documented error type and throws on anything else. What is the risk?","options":["Error types can grow, so a new value hits no branch; keep a safe default","Error types never change under the API versioning policy, so there is no risk","The API rejects clients that use switch statements","Exhaustive switches are slower than if-else chains"],"answers":[0],"explanation":"The versioning policy reserves the right for error type values to grow. A contract is what is promised plus what is reserved: handle the values you know, default the rest, log the request identifier, and never match on message text.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"270"},{"id":"C271","domain":"Applications and Integration","question":"Which statement best describes the Claude Messages API as an HTTP interface?","options":["A WebSocket API that keeps a persistent session per user and streams each conversation turn over it","A stateless REST API: you POST JSON to /v1/messages with auth and version headers","A stateful API that stores each conversation by ID so later calls only send the new turn","A SOAP API requiring XML envelopes"],"answers":[1],"explanation":"Each request needs a credential (x-api-key or an Authorization bearer token), anthropic-version and content-type: application/json. Statelessness means continuity is something your code supplies.","sources":["https://platform.claude.com/docs/en/api/errors"],"origin":"Community","sourceId":"271"},{"id":"C272","domain":"Applications and Integration","question":"A service must push live updates to a browser and receive user messages back over the same long-lived connection. Which shape fits?","options":["Short polling every 500 ms","A single request and response","A WebSocket, because both ends send unprompted over one persistent connection","Server-sent events, which are naturally two-way"],"answers":[2],"explanation":"Persistence and two-way messaging are separate properties. SSE (which Claude streaming uses) pushes server-to-client only; polling pins staleness to the interval. Two-way, long-lived exchanges are what WebSockets are for.","sources":[],"origin":"Community","sourceId":"272"},{"id":"C273","domain":"Applications and Integration","question":"Select the TWO practices for robust JSON handling of API responses.","options":["Coerce missing values to an empty string so downstream code never fails","Read fields by name and ignore unknown fields rather than rejecting the whole object","Treat an absent field and a field that is null as different statements","Parse responses positionally, by the order fields appear"],"answers":[1,2],"explanation":"Tolerate additions, keep absent, null and empty distinct, and reject real type mismatches visibly. Coercing a missing value into a present one hides failures.","sources":[],"origin":"Community","sourceId":"273"},{"id":"C274","domain":"Applications and Integration","question":"A team must replace a deprecated request parameter whose replacement behaves differently, across 40 call sites, within six months. What is the best plan?"
